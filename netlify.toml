[build]
  command = "npm run build"
  publish = "_site"
  # README·legacy·PDF만 바뀐 커밋은 빌드를 아예 돌리지 않는다.
  # 무료 플랜은 프로덕션 배포 1회당 크레딧을 먹으므로, 이관 기간의 잦은 커밋 상당수가 여기 걸린다.
  # exit 0 = 건너뜀, exit 1 = 빌드.
  ignore = "git diff --quiet $CACHED_COMMIT_REF $COMMIT_REF -- src tools package.json package-lock.json netlify.toml eleventy.config.mjs"

[build.environment]
  NODE_VERSION = "22"

# 검색 인덱스는 매 빌드마다 바뀐다. 캐시되면 새 항목이 검색에 안 잡힌다.
[[headers]]
  for = "/search-index.js"
  [headers.values]
    Cache-Control = "public, max-age=0, must-revalidate"

# 배포 반영 확인용. 절대 캐시하면 안 된다 — 캐시된 build.json 은 거짓말을 한다.
[[headers]]
  for = "/build.json"
  [headers.values]
    Cache-Control = "no-store"

[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=3600"

[[headers]]
  for = "/*"
  [headers.values]
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"

# 예전 치트시트 URL을 새 구조로 넘긴다. A4 4개까지 전부 — 파일이 실제로 있었다.
[[redirects]]
  from = "/cheatsheet.html"
  to = "/ref/cli/"
  status = 301
[[redirects]]
  from = "/cheatsheet-a4.html"
  to = "/ref/cli/"
  status = 301
[[redirects]]
  from = "/cheatsheet-desktop.html"
  to = "/ref/desktop/"
