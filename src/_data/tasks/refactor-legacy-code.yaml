id: refactor-legacy-code
title: 레거시 코드를 리팩터링해야 한다
group: quality
order: 80
phrasings:
  - 리팩터링
  - 레거시 코드
  - 코드 정리
  - 기술 부채
  - 구조 개선
  - 코드 품질
summary: plan 모드로 탐색 → 점진적 개선 → 테스트 유지 → 커밋 그룹핑
intro: |
  레거시 코드를 고치는 건 새 기능을 추가하는 것과 다르다. 구조를 이해하지 않고 건드리면
  의존성이 끊어지고 회귀가 발생한다. 읽기 전용으로 구조를 파악한 뒤 점진적으로 고치는 게 안전하다.
steps:
  - what: plan 모드로 구조를 파악한다
    how: |
      `Shift+Tab` 으로 plan 모드에 들어가서 코드 구조, 의존성, 주요 함수 호출 경로를 파악한다.
      이 단계에서는 읽기만 하고 편집하지 않는다.
    refs:
      - cli/permission-modes#plan
  - what: 리팩터링 범위를 좁힌다
    how: |
      전체를 한 번에 고치지 말고 파일 단위나 모듈 단위로 나눈다. 큰 변경은 여러 커밋으로 쪼개서
      한 번에 실패 범위를 줄인다.
  - what: 기존 테스트를 확인한다
    how: |
      테스트가 없으면 먼저 리팩터링 전 상태를 테스트로 만든다. 테스트 없는 리팩터링은
      회귀 감지가 불가능하다.
  - what: 점진적으로 개선한다
    how: |
      한 번에 많이 고치지 말고 작은 단계로 나눈다. 각 단계마다 테스트를 실행해서
      회귀가 없는지 확인한다.
  - what: 커밋을 기능 단위로 그룹핑한다
    how: |
      "파일 단위"가 아니라 "기능 단위"로 커밋한다. 같은 리팩터링을 완성하는 변경들을
      논리적으로 묶어서 커밋한다.
caveat: |
  리팩터링과 기능 추가를 섞지 말 것. 구조 변경과 새 기능을 같이 하면 문제가 생겼을 때
  원인을 분리하기 어렵다. 구조 먼저, 기능 나중으로 순서를 지킨다.
prompts:
  - explain-data-flow
  - audit-my-own-fix
