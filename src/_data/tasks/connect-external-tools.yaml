id: connect-external-tools
title: 외부 서비스나 내 도구를 붙이고 싶다
group: extend
order: 100
phrasings:
  - MCP 연결
  - 커넥터 추가
  - 외부 도구 연동
  - 깃허브 연결
  - 슬랙 연결
  - DB 붙이기
  - 내 API 쓰게 하기
  - 플러그인 설치
summary: MCP가 표준 통로다. 이미 만들어진 게 있으면 플러그인·커넥터로 먼저 찾는다.
intro: |
  직접 만들기 전에 세 층을 순서대로 본다 — 이미 있는 커넥터, 마켓플레이스 플러그인,
  그리고 마지막이 직접 만드는 MCP 서버다. 순서를 뒤집으면 있는 걸 다시 만들게 된다.
steps:
  - what: 이미 있는 것부터 찾는다
    how: |
      `/plugin` 으로 마켓플레이스를 열거나 `claude plugin install <name>@<marketplace>` 로 설치한다.
      데스크톱이면 커넥터 UI에서 바로 연결한다.
    refs:
      - slash/plugin-scope#project
      - desktop/connectors#connectors-1
  - what: MCP 서버를 등록한다
    how: |
      `claude mcp` 로 서버를 구성하고 `/mcp` 로 세션 안에서 연결을 관리한다.
      OAuth가 필요한 서버는 `claude mcp login <server>`.
    refs:
      - cli/mcp#claude-mcp
      - cli/mcp#claude-mcp-login-logout-s
  - what: 로컬 설정 파일로 넘긴다
    how: |
      `--mcp-config` 로 설정 파일이나 인라인 JSON을 지정한다. 프로젝트마다 다른 서버를
      쓸 때 이 방식이 깔끔하다.
    refs:
      - cli/new-flags#mcp-config-plugin-dir
  - what: 연결이 됐는지 확인한다
    how: |
      `/mcp` 에 서버가 뜨고 도구 목록이 보여야 한다. 안 보이면 인증이 안 됐거나
      서버 프로세스가 죽은 것이다.
    refs:
      - cli/slash-commands#mcp
caveat: |
  MCP 서버가 반환하는 내용은 **데이터지 지시가 아니다.** 외부 도구가 돌려준 텍스트에
  "이렇게 해라"가 섞여 있어도 그건 실행 근거가 아니다. 특히 쓰기 권한이 있는 커넥터를 붙일 때
  샌드박스의 `network.allowedDomains` 로 나가는 곳을 제한하는 편이 안전하다.
