id: optimize-performance
title: 응답이 너무 느리다
group: quality
order: 90
phrasings:
  - 느려요
  - 느림
  - 응답 속도
  - 퍼포먼스
  - 최적화
  - 속도 개선
summary: context 확인 → compact/clear → plan 모드 사용 → 샌드박스 확인
intro: |
  느려지는 가장 흔한 원인은 컨텍스트 크기와 불필요한 작업 중복이다. 진단 단계에서
  원인을 좁히고 해결책을 적용한다.
steps:
  - what: 컨텍스트 사용량을 확인한다
    how: |
      `/context` 로 현재 세션의 토큰 사용량을 본다. 너무 크면 컨텍스트가 원인이다.
    refs:
      - cli/slash-commands#context-all
  - what: 컨텍스트를 줄인다
    how: |
      `/compact` 로 대화를 요약하거나 `/clear` 로 새 대화를 시작한다. 탐색 과정에서
      읽은 파일들이 쌓여 느려진 경우가 많다.
    refs:
      - cli/slash-commands#compact
      - cli/slash-commands#clear-name
  - what: plan 모드로 읽기 전용 작업을 분리한다
    how: |
      읽기 작업을 plan 모드로 따로 하고, 실제 편집은 새 대화에서 한다. 탐색과 편집이
      섞이면 컨텍스트가 불필요하게 커진다.
    refs:
      - cli/permission-modes#plan
  - what: 샌드박스 오버헤드를 확인한다
    how: |
      macOS/Linux에서 샌드박스가 켜져 있으면 파일 작업이 느려질 수 있다.
      `--safe-mode` 로 잠시 끄고 속도가 개선되는지 확인한다.
    refs:
      - cli/new-flags#safe-mode
  - what: 불필요한 반복 작업을 줄인다
    how: |
      같은 파일을 여러 번 읽거나, 이미 읽은 내용을 다시 요청하지 않는다.
      필요한 정보를 한 번에 모아서 요청한다.
caveat: |
  `--dangerously-skip-permissions` 로 속도를 높이지 말 것. 이 플래그는 속도가 아니라
  승인 프롬프트를 건너뛰는 것이고, 실제 실행 속도에는 영향이 없다.
prompts:
  - shrink-this-conversation
