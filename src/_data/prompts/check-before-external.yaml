id: check-before-external
title: 외부로 나가기 전 실명·경로 검사
summary: 공유·배포 직전에 개인정보와 로컬 경로가 섞였는지 기계적으로 훑는다.
stage: ship
tags: [privacy, review, release]
tasks: []

origin: own
redistribute: allow
verified: tested
tested_on: "2026-08-13 · Claude Code · 이 리포의 PII 게이트를 만들면서 사용"

slots:
  scope: "이번 커밋에 포함되는 파일 전체"

body: |
  {scope} 를 외부로 내보내기 전 검사해줘. 찾을 것:

  - 이메일 주소
  - 로컬 사용자 홈 경로 (Windows 의 사용자 폴더, macOS·Linux 의 홈 디렉터리)
  - 개인 개발 디렉터리 경로 (드라이브 문자로 시작하는 절대경로)
  - API 키·토큰 형식 문자열
  - 사람 이름으로 보이는 것
  - 사내·거래처 고유명사

  발견하면 파일:줄과 해당 문자열을 그대로 보여줘. 판단은 내가 한다.
  문서용 자리표시자(example.com, user@host 등)는 구분해서 표시해.

  마지막에 검사한 파일 수를 적어. 0개면 범위 지정이 잘못된 것이다.

teaches: |
  마지막 줄이 조용한 실패를 막는다. glob 이 안 맞아 0개를 검사하고 "문제 없음"으로
  끝나는 게 이 검사의 가장 흔한 실패 모드다.

  "판단은 내가 한다"가 없으면 모델이 알아서 지우거나 마스킹해서, 무엇이 있었는지
  확인할 기회가 사라진다.

  중요한 건 이 검사를 **재생성할 때마다 다시** 돌리는 것이다. 소스만 고치고 산출물을
  다시 검사하지 않으면 예전 산출물에 남은 게 그대로 나간다.

next: |
  반복되면 정규식 게이트로 옮긴다. 다만 **실명 사전은 만들지 말 것** —
  실명 목록을 공개 리포에 커밋하는 순간 그 파일이 유출이다.
  정규식 + git config user.name + .gitignore 된 로컬 무시목록 조합이 맞다.

export_command: true
