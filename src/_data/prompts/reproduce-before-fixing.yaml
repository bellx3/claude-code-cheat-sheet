id: reproduce-before-fixing
title: 고치기 전에 재현부터 시키기
summary: 원인을 짐작으로 고치는 걸 막는다. 재현 못 하면 거기서 멈추게 한다.
stage: review
tags: [debug, verification]
tasks: [it-broke]

origin: own
redistribute: allow
verified: tested
tested_on: "2026-08-13 · Claude Code · 이 리포의 PDF 용지 크기 문제에 실제로 사용"

slots:
  symptom: "빌드는 통과하는데 배포된 페이지에 변경이 안 보인다"

body: |
  {symptom}

  고치지 말고 먼저 재현해줘.
  1. 이 증상을 재현하는 명령 한 줄과 그 **실제 출력**을 보여줘.
  2. 재현이 안 되면 거기서 멈추고 "재현 실패"라고 말해. 추측으로 넘어가지 마.
  3. 재현됐으면 원인을 한 문장으로 쓰고, 근거가 되는 파일:줄을 붙여.

  이 세 단계가 끝나기 전에는 파일을 고치지 마.

teaches: |
  2번이 핵심이다. "재현 실패"라고 말할 여지를 주지 않으면 모델은 그럴듯한 원인을 지어내고
  그걸 고치기 시작한다. 증상이 우연히 사라지면 고쳐진 것처럼 보이지만 원인은 남아 있다.

  3번의 "파일:줄"이 없으면 일반론("캐시 문제일 수 있습니다")으로 도망간다.

next: |
  재현이 끝나면 [「고쳤다」를 증명하게 만들기](/prompts/prove-dont-claim/) 로 이어서
  수정 후 양방향 확인까지 시킨다.

export_command: true
