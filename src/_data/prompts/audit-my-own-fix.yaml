id: audit-my-own-fix
title: 방금 고친 코드를 다시 감사시키기
summary: 수정이 새 결함을 만들었는지 본다. 고친 사람과 감사하는 사람을 분리하는 효과.
stage: review
tags: [review, regression, verification]
tasks: [review-before-merge, it-broke]

origin: own
redistribute: allow
verified: tested
tested_on: "2026-08-13 · Claude Code"

slots:
  scope: "--staged"

body: |
  {scope} 범위의 변경은 방금 어떤 문제를 고치려고 한 것이다.
  이 수정 자체를 감사해줘. 고친 사람 편에 서지 말고 반박하는 쪽으로.

  확인할 것:
  1. 이 수정이 원래 문제를 정말 해결하는가 — 되돌리면 다시 깨지는지 확인해봤는가
  2. 이 수정이 새로 깨뜨리는 게 있는가 — 같은 함수·같은 파일을 쓰는 다른 경로
  3. 내 환경에서만 통과할 조건이 섞였는가 — 경로·OS·설치된 도구·타이밍
  4. 검사를 추가했다면, 그 검사가 이번 결함만 잡는가 아니면 같은 계열을 다 잡는가

  각 항목에 "확인함(근거)" 또는 "확인 못 함(이유)" 으로 답해.
  괜찮아 보인다는 말은 하지 마.

teaches: |
  수정이 새 결함을 만드는 건 흔하다. 원인은 대개 넷 중 하나다 —
  실데이터에서 다르게 동작 / 내 환경에서만 통과 / 아는 것만 막는 검사 / 재현 없이 가설만 고침.
  위 4개 질문이 그 넷에 하나씩 대응한다.

  "반박하는 쪽으로"가 없으면 모델이 방금 자기가 쓴 코드를 변호한다.

next: |
  4번에서 "이번 것만 잡는다"가 나오면 검사를 일반화한다.
  일반화가 어려우면 최소한 회귀 테스트로 못 박아둔다.

export_command: true
