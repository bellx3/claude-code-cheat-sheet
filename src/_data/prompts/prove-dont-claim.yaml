id: prove-dont-claim
title: "\"고쳤다\"를 증명하게 만들기"
summary: 수정 후 양방향 검증(고치면 통과 / 되돌리면 실패)을 강제한다.
stage: review
tags: [debug, verification, regression]
tasks: [it-broke, review-before-merge]

origin: own
redistribute: allow
verified: tested
tested_on: "2026-08-13 · Claude Code"

slots:
  symptom: "빌드는 통과하는데 배포된 페이지에 변경이 안 보인다"

body: |
  {symptom} — 이 문제를 고치기 전에 먼저 재현해줘.

  순서를 지켜:
  1. 실패를 재현하는 명령 한 줄과 그 출력을 보여줘. 재현 못 하면 거기서 멈추고 말해.
  2. 원인을 한 문장으로. 근거가 되는 파일:줄을 붙여.
  3. 고친다.
  4. 같은 명령을 다시 돌려 통과를 보여줘.
  5. 고친 부분을 **일부러 되돌려서** 다시 실패하는지 보여줘. 되돌려도 통과하면
     원인을 잘못 짚은 것이니 1번으로 돌아가.

  각 단계의 실제 출력을 붙여. "통과했습니다" 같은 요약만으로는 안 돼.

teaches: |
  5번이 핵심이다. 재현 없이 짐작으로 고치면 증상이 우연히 사라진 것과
  원인을 없앤 것을 구분할 수 없다. **되돌렸는데도 통과한다면** 진짜 원인은 여전히 남아 있고
  다른 무언가가 증상을 가린 것이다.
  1번의 "재현 못 하면 멈추고 말해"가 없으면 재현 단계를 건너뛰고 바로 코드를 고치기 시작한다.

next: |
  이 프롬프트가 계속 필요하다면 아예 CLAUDE.md에 규칙으로 박는 게 낫다.
  매번 붙이는 대신 프로젝트 기본값이 된다.

export_command: true
