id: decide-then-report
title: 선택지 나열 대신 결정하게 하기
summary: >-
  「이런 방법들이 있습니다」로 끝나는 답을 막고 근거 있는 하나를 고르게 한다.
stage: discover
tags: [decision, planning]
tasks: [onboard-unknown-repo]

origin: own
redistribute: allow
verified: tested
tested_on: "2026-08-13 · Claude Code · 이 리포의 정적 사이트 생성기 선택에 사용"

slots:
  question: "이 프로젝트에 정적 사이트 생성기를 쓴다면 무엇이 맞나"

body: |
  {question}

  선택지를 나열하지 말고 **하나를 골라서** 답해줘.

  형식:
  1. 결론 한 줄
  2. 그렇게 고른 근거 — 이 프로젝트의 구체적 조건과 연결해서. 일반론 금지
  3. 차선 하나와, 어떤 조건이 바뀌면 그쪽으로 가야 하는지
  4. 이 판단에서 확인 안 한 것 — 있으면 "미확인"이라고 명시

  근거로 쓴 수치나 사실은 어디서 확인한 건지 밝혀. 확인 안 했으면 확인 안 했다고 써.

teaches: |
  "A, B, C가 있고 각각 장단점이 있습니다"는 판단을 되돌려주는 것이라 아무 일도 안 한 것과 같다.
  하나를 고르게 하면 근거를 대야 하고, 근거가 약하면 그게 드러난다.

  3번(재검토 조건)이 결론을 안전하게 만든다. 지금 틀렸더라도 언제 다시 볼지가 같이 오면
  되돌릴 수 있다. 4번이 없으면 확인한 것과 추측한 것이 같은 톤으로 섞여 나온다.

next: |
  결론이 나오면 그 근거 중 확인 안 한 항목부터 실제로 재본다.
  「미확인」이 결정을 뒤집을 만한 것이면 그것부터다.

export_command: true
