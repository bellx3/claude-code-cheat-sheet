id: cc0-act-as-terminal
title: 설명 없이 출력만 내놓게 하기 (터미널 흉내)
summary: 도구 출력 포맷을 흉내 내야 할 때 쓰는 고전 프롬프트. 출력 형식을 강하게 못 박는 예시.
