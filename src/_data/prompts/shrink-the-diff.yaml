id: shrink-the-diff
title: 변경을 최소로 줄이게 하기
summary: 요청하지 않은 리팩터링이 섞여 들어오는 걸 막는다.
stage: build
tags: [review, scope, refactor]
tasks: [review-before-merge]

origin: own
redistribute: allow
verified: tested
tested_on: "2026-08-13 · Claude Code"

slots:
  goal: "권한 모드 표에 dontAsk 행을 추가"

body: |
  목표: {goal}

  이 목표를 달성하는 **가장 작은 변경**만 해줘.

  - 목표와 무관한 리팩터링·포맷팅·이름 변경은 하지 마.
  - 고치고 싶은 게 보이면 고치지 말고 목록으로만 알려줘.
  - 다 하고 나서 `git diff --stat` 를 보여주고, 각 파일이 왜 바뀌어야 했는지 한 줄로 설명해.
  - 설명할 수 없는 변경이 있으면 되돌려.

teaches: |
  마지막 줄이 실제로 작동한다. "왜 바뀌었는지 설명하라"를 사후에 요구하면
  설명 못 할 변경을 스스로 걸러낸다.

  포맷팅이 섞이면 리뷰가 불가능해진다 — 진짜 변경 3줄이 공백 정리 200줄에 묻힌다.
  이건 모델의 성실함 문제가 아니라 범위를 안 잠근 쪽 문제다.

next: |
  이 규칙이 매번 필요하면 CLAUDE.md 에 프로젝트 기본값으로 박는 게 낫다.
  포맷팅은 PostToolUse 훅으로 따로 돌리면 diff 와 분리된다.

export_command: true
