id: extract-lessons
title: 작업이 끝날 때 배운 것 뽑아내기
summary: 마찰·재작업·"도구가 안 맞아서" 순간을 다음 세션이 쓸 수 있는 형태로 남긴다.
stage: ship
tags: [memory, retrospective]
tasks: [onboard-unknown-repo]

origin: own
redistribute: allow
verified: tested
tested_on: "2026-08-13 · Claude Code · 이 사이트 구축 후 실제로 실행"

slots:
  target: "CLAUDE.md"

body: |
  이번 작업에서 배운 것을 {target} 에 추가할 형태로 뽑아줘. 1~5개.

  뽑는 기준:
  - 다음에 같은 작업을 할 때 **모르면 또 시간을 쓸 것**만
  - 이미 문서에 있거나 검색하면 나오는 건 제외
  - "조심하자" 같은 다짐 말고, 무엇을 어떻게 하라는 지시 형태로

  각 항목에 붙일 것:
  (1) 무엇을 하라 / 하지 말라
  (2) 왜 — 실제로 겪은 증상을 근거로. 일반론이면 빼
  (3) 어긴 걸 자동으로 잡을 방법이 있으면 그것도

  이번 작업에서 안 겪은 건 넣지 마.

teaches: |
  "이번 작업이 무엇을 가르쳤나"를 묻지 않으면 마찰이 기억에만 남고 다음 세션에 사라진다.

  (2)의 "실제로 겪은 증상"이 핵심이다. 근거 없는 규칙은 나중에 왜 있는지 몰라서
  지워지거나 무시된다. (3)이 있으면 규칙이 사람 기억이 아니라 게이트로 옮겨간다 —
  그게 실제로 지켜지는 유일한 형태다.

next: |
  나온 항목 중 (3)이 있는 것부터 실제 검사로 구현한다.
  문서에만 적힌 규칙은 세 번째 세션쯤 지켜지지 않는다.

export_command: true
