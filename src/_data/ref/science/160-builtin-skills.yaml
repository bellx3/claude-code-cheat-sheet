items:
  - id: settings-skills
    term: Settings > Skills
    kind: value
    tier: full
    desc: Settings > Skills · 자동 로드, 컴포저에 / 입력해 직접 선택 가능
    detail: |
      스킬은 **방법·도구·확인할 것을 적어 둔 지시문 묶음**이다. 작업이 그것을 요구하면 Claude 가
      자동으로 불러오고, `/` 로 직접 지정할 수도 있다.

      조직이 배포한 스킬과 내가 앱에서 퍼블리시한 스킬은 **다른 컴퓨터에서 로그인해도 다시 나타난다**
      (메모리·설정·앱에서 추가한 커넥터는 컴퓨터별로 남는다).
    see_also: [science/custom-skills#add-skill]
