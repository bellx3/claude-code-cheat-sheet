items:
  - id: approval-scope-1
    term: 설명
    kind: note
    tier: full
    desc: 폴더 접근·코드 실행·원격 잡·커넥터 툴마다 카드 표시
    detail: |
      **종류마다 고를 수 있는 범위가 다르다** — 폴더는 읽기 전용/읽기·쓰기를 고르고 철회할 때까지
      유지, 코드 실행은 Once 또는 Always, 네트워크 호스트는 철회할 때까지,
      커넥터 도구와 원격 잡은 아래 네 범위 전부.

      상시 허가는 **Settings > Permissions** 한 곳에 모여 있고 거기서 철회한다.
    see_also: [science/what-is#what-is-3]
  - id: once
    term: Once
    kind: value
    tier: core
    desc: 이번 한 번만
  - id: this-conversation
    term: This conversation
    kind: value
    tier: core
    desc: 현재 세션 동안
  - id: this-project
    term: This project
    kind: value
    tier: core
    desc: 이 프로젝트 전체
  - id: global
    term: Global
    kind: value
    tier: core
    desc: 모든 프로젝트
    detail: |
      가장 넓은 범위다. 원격 잡·커넥터 도구에 Global 을 주면 **이후 어느 프로젝트에서든 묻지 않는다** —
      되돌리려면 Settings > Permissions 에서 철회해야 한다.
