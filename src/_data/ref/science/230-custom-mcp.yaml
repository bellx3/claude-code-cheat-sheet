# legacy/cheatsheet-science.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: custom-mcp
title: 커스텀 MCP 커넥터
group: connect
order: 230
sheet: science
summary: >-
  직접 만든 MCP 커넥터 연결.
source:
  url: https://claude.com/docs/claude-science/custom-connectors
  checked_at: "2026-08-24"
items:
  - id: settings-connectors-add-connector
    term: Settings > Connectors > Add connector
    kind: value
    tier: full
    desc: Settings > Connectors > Add connector → Remote(HTTPS) 또는 Local command. Name은 소문자·숫자·하이픈만
    detail: |
      MCP 서버면 무엇이든 붙는다. **Browse Connectors Directory** 로 공개 디렉터리를 열 수도 있다.
      로그인이 필요한 Remote 서버는 제공자의 사인인 페이지로 안내한다.
  - id: remote
    term: Remote
    kind: value
    tier: full
    desc: ": 서버 URL + Advanced(transport SSE/Streamable HTTP, OAuth, Headers helper)"
  - id: local-command
    term: Local command
    kind: value
    tier: full
    desc: ": 실행 명령 + Advanced(인자, 환경변수)"
  - id: ask-each-time
    term: Ask each time
    kind: value
    tier: full
    desc: 툴 기본값 → Tools 탭에서 Always allow/Block
    detail: |
      직접 추가한 커넥터의 모든 도구는 **Ask each time 에서 시작한다** — Featured 커넥터가 카드 없이
      도는 것과 다른 점이다. 커넥터 단위로 Skip approvals 를 켜면 그 커넥터의 모든 도구에서
      호출별 카드가 사라진다.
  - id: local-sandbox
    term: Local command 커넥터의 실행 환경
    kind: value
    tier: full
    desc: 샌드박스 안에서, Claude 코드와 같은 네트워크 제한 + 커넥터별 쓰기 가능 디렉터리
    aliases: [로컬 커넥터]
    detail: |
      **샌드박스 밖이 아니다** — Claude 가 쓰는 코드와 같은 네트워크 제한을 받고 자기 쓰기 디렉터리를
      하나 갖는다. 대신 환경변수가 암호화 없이 설정 파일에 저장되므로(내 계정만 읽을 수 있다)
      고가치 시크릿은 넣지 않는다.
  - id: custom-mcp-1
    term: 위험
    kind: note
    tier: core
    pin: true
    tone: danger
    desc: Local 커넥터 환경변수는 암호화 없이 설정 파일 저장 — 고가치 시크릿 금지. Skip approvals는 신뢰하는 개발자만
