# legacy/cheatsheet-science.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: what-is
title: Claude Science란
group: start
order: 10
sheet: science
summary: >-
  연구용 노트북 워크벤치. 로컬 우선이라 데이터가 내 컴퓨터에 보존.
source:
  url: https://claude.com/docs/claude-science/overview
  checked_at: "2026-08-24"
items:
  - id: what-is-1
    term: 설명
    kind: note
    tier: full
    desc: >-
      Claude + 로컬 분석 환경을 결합한 데스크톱 앱. 자연어로 요청하면 Python/R/shell 코드를 샌드박스에서 작성·실행하고, 결과를 출처 기록이 포함된 버전
      관리 아티팩트로 저장
    detail: |
      자연어로 연구 과제를 설명하면 Claude 가 Python·R·shell 코드를 **샌드박스에서** 쓰고 실행하고,
      허락한 폴더를 읽고, 커넥터로 과학 데이터베이스에서 데이터를 가져와, 결과를 **출처 기록이
      붙은 버전 관리 아티팩트**로 저장한다.

      Jupyter 노트북처럼 셀 단위로 돌지만, 셀을 내가 쓰지 않는다는 것과 실행 기록이 결과에
      묶여 남는다는 것이 다르다. **macOS·Linux 베타**다(네이티브 Windows 빌드는 아직 없다).
  - id: what-is-2
    term: 파일은 내 컴퓨터에 유지, 코드는 샌드박스에서 실행
    kind: note
    tier: full
    detail: |
      Anthropic 은 파일을 호스팅하지 않는다 — 브라우저 탭에서 열리지만 **로컬 앱**이고 공개 URL 이 없다.

      다만 **프롬프트에 답하려고 Claude 가 읽은 파일 내용은 그 대화의 일부로 API 에 전달되고**
      표준 보존 정책을 따른다. "로컬"은 저장 위치의 이야기이지 모델에 아무것도 가지 않는다는
      뜻이 아니다.

      예외 하나: 컴포저의 **Attach files** 는 파일을 앱 로컬 데이터 폴더로 복사해 대화에 붙인다
      (제자리 읽기가 아니다).
    caveat: 다른 컴퓨터에서 로그인해도 프로젝트·아티팩트·대화 기록은 따라오지 않는다 — 계정이 옮기는 것은 플랜·사용량 한도와 조직 스킬뿐이다. 유일한 사본이 내 컴퓨터에 있으므로 데이터 폴더를 백업에 넣어야 한다.
  - id: what-is-3
    term: 새 폴더·네트워크 호스트·원격 잡은 매번 승인 후 사용
    kind: note
    tier: full
    detail: |
      승인 카드가 대화 안에 뜨고 **무엇을 요구하는지 정확히 이름을 밝힌다.** 종류마다 지속 범위가 다르다 —
      폴더는 읽기 전용/읽기·쓰기를 골라 철회할 때까지, 코드 실행은 Once 또는 Always,
      네트워크 호스트는 철회할 때까지, 커넥터 도구와 원격 잡은 Once·이 대화·이 프로젝트·Global.

      상시 허가는 전부 **Settings > Permissions** 에 나열되고 거기서 철회한다.
    see_also: [science/approval-scope#once]
  - id: what-is-4
    term: 리뷰어
    kind: value
    tier: full
    desc: 백그라운드에서 주장과 실제 실행 기록을 대조
    detail: |
      **재실행은 하지 않는다** — 응답·승인된 plan·아티팩트·실행 기록을 다시 읽어 주장이 실제로
      돌아간 것과 맞는지 본다. 그래서 "방법이 이 연구 질문에 맞았는가"는 판단하지 않는다.
    see_also: [science/reviewer#reviewer-1]
  - id: what-is-5
    term: 위험
    kind: note
    tier: core
    pin: true
    tone: danger
    desc: 연구 도구 — 임상·진단 용도 아님. 리뷰어는 오류를 줄일 뿐 없애지 못하므로 결과는 반드시 직접 검증
