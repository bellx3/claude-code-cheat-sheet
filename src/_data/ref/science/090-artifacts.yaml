# legacy/cheatsheet-science.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: artifacts
title: 아티팩트 & Provenance
group: use
order: 90
sheet: science
summary: >-
  산출물과 그 출처 추적. 무엇이 어떤 실행에서 나왔는지 기록.
source:
  url: https://claude.com/docs/claude-science/artifacts
  checked_at: "2026-08-24"
items:
  - id: artifacts-1
    term: 영구 보존
    kind: value
    tier: full
    desc: 아티팩트만 영구 — 그 외 세션 파일은 종료 몇 시간 후 삭제
    aliases: [아티팩트, 산출물]
    detail: |
      **남길 스크래치 파일은 저장해 달라고 말해야 한다.** 아티팩트는 앱 데이터 폴더에 있고 내가
      지울 때까지 남는다. 밖으로 꺼낼 때는 파일 하나면 **Download**, 여러 개면
      `~/.claude-science` 아래 프로젝트 폴더에서 직접 복사한다.
  - id: version-stepper-diff
    term: 같은 파일명 재저장 = 새 버전. 열면 version stepper + diff 토글
    kind: note
    tier: full
  - id: artifacts-2
    term: 당시 버전
    kind: value
    tier: full
    desc: 과거 버전은 읽기 전용 — 복원은 다시 저장 요청, 대화 속 링크는 당시 버전을 가리킴
    detail: |
      diff 모드에서는 비교 대상 버전을 고를 수 있다(기본은 직전 버전).
      **이름을 바꿔도 링크는 깨지지 않지만 Delete 는 모든 버전을 영구 삭제한다.**
  - id: markdown-code-plain-text-edit-content-save
    term: "인라인 편집 가능: Markdown, code, plain text (Edit content → Save = 새 버전) 불가: 이미지, PDF,"
    kind: note
    tier: full
    desc: "인라인 편집 가능: Markdown, code, plain text (Edit content → Save = 새 버전) 불가: 이미지, PDF, HTML, 테이블"
  - id: messages
    term: Messages
    kind: value
    tier: full
    desc: Messages · Code(스크립트·노트북 다운로드) · Execution Log · Environment(환경명·언어·패키지 버전) · Review
    detail: |
      **모든 아티팩트 버전이 어떻게 만들어졌는지를 기록한다** — 저장 시점 전후의 대화(Messages),
      재현 가능한 스크립트(Code), 실행된 모든 명령(Execution Log), 환경과 패키지 버전(Environment),
      리뷰어가 남긴 findings(Review).
    see_also: [science/reviewer#reviewer-1]
    subhead: Provenance 5개 탭
  - id: artifacts-3
    term: 주의
    kind: note
    tier: core
    pin: true
    tone: warn
    desc: Execution Log가 실행의 권위 있는 기록 — Code 탭과 불일치하면 로그를 신뢰. ~/.claude-science 내부 파일 직접 이동·삭제 금지
    subhead: Provenance 5개 탭
