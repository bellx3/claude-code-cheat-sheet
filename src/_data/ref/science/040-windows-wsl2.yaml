id: windows-wsl2
title: Windows (WSL2)
group: start
order: 40
sheet: science
summary: >-
  Windows 에서는 WSL2 안에서 구동. WSL1 은 불가.
source:
  url: https://claude.com/docs/claude-science/run-on-windows-wsl
  checked_at: "2026-08-24"
items:
  - id: wsl-install-d-ubuntu-24-04
    term: wsl --install -d Ubuntu-24.04
    kind: snippet
    tier: full
    desc: 예시
    detail: |
      **네이티브 Windows 빌드가 없어서** 리눅스 바이너리를 WSL 2 안에서 돌리는 것이다.
      설치는 5분쯤 걸린다. Ubuntu 24.04 이상을 쓰는 이유는 샌드박스가 bubblewrap 0.8.0 이상을
      요구하는데 22.04 가 그보다 낮기 때문이다.

      설치는 **Ubuntu 안에서** 해야 한다 — Windows 브라우저로 바이너리를 받아 복사해 오면
      검증과 안정 채널을 건너뛴다.
    code: |-
      # 관리자 PowerShell
      wsl --install -d Ubuntu-24.04
      wsl -l -v                        # 버전 2 확인
      wsl --set-version Ubuntu-24.04 2 # 1이면 전환

      # WSL 내부
      sudo apt update && sudo apt install -y curl bubblewrap socat
      curl -fsSL https://claude.ai/install-claude-science.sh | bash
      . ~/.profile && claude-science --version
      claude-science serve --port 8765 --no-browser
  - id: windows-wsl2-1
    term: 설명
    kind: note
    tier: full
    desc: WSL2가 localhost 자동 포워딩 → 출력 URL을 Windows 브라우저에 붙여넣기
    detail: |
      출력된 URL 에는 **1회용 사인인 토큰**이 들어 있다(약 3분 후 만료). 나중에 새로 받으려면
      `claude-science url` 이다.

      증상별 원인 — `command not found` 는 PATH(`. ~/.profile`), `bwrap too old` 는 Ubuntu 버전,
      `daemon already running on port ...` 은 이미 돌고 있는 것(`claude-science url` 로 링크만 받으면 된다),
      `port ... is already in use` 는 다른 프로그램이 쓰는 것(`--port 8080`),
      브라우저가 `localhost` 로 못 닿으면 커스텀 `.wslconfig` 네트워크 모드일 수 있으니
      Ubuntu 안에서 `hostname -I` 로 나온 주소를 쓴다.
    tasks: [windows-gotchas]
  - id: keep-running
    term: PowerShell 에서 바로 띄우기
    kind: snippet
    tier: full
    desc: Ubuntu 터미널을 열지 않고 시작
    code: |-
      wsl -d Ubuntu-24.04 -- ~/.local/bin/claude-science serve --port 8765 --no-browser
      # 이 PowerShell 창을 열어 두면 VM 이 살아 있다

      # 이미 열린 Ubuntu 세션에서 백그라운드로 돌리려면
      claude-science serve --port 8765 --no-browser --detached
    detail: |
      앱은 WSL 가상머신 안에서 돌기 때문에 **VM 이 내려가면 함께 멈춘다.** 마지막 Ubuntu 터미널을
      닫으면 잠시 뒤 VM 이 내려가고, `wsl --shutdown` 은 즉시 내린다.
    tasks: [windows-gotchas]
  - id: windows-wsl2-2
    term: 주의
    kind: note
    tier: core
    pin: true
    tone: warn
    desc: WSL 1 불가, Ubuntu 24.04 이상 필요. wsl --shutdown 시 앱도 종료
