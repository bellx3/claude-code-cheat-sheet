id: runtime-packages
title: 실행 환경 & 패키지
group: use
order: 80
sheet: science
summary: >-
  패키지를 어떻게 설치하고 어디에 격리되는지.
source:
  url: https://claude.com/docs/claude-science/tools-and-environments
  checked_at: "2026-08-24"
items:
  - id: runtime-packages-1
    term: 설명
    kind: note
    tier: full
    desc: Python·R은 persistent kernel에서 실행, 변수 유지. 약 30분 idle·패키지 설치·세션 종료 시 재시작
    detail: |
      커널이 살아 있는 동안 변수가 메모리에 남으므로 단계를 나눠 진행할 수 있다.
      **재시작 조건 셋을 기억할 것** — 유휴 30분, 패키지 설치로 환경이 바뀔 때, 세션 종료.
      재시작되면 메모리의 변수는 사라진다.
  - id: starter-environments
    term: Starter environments (읽기 전용)
    kind: note
    tier: full
    desc: "Python: numpy, pandas, scipy, matplotlib, seaborn, pillow R: tidyverse, ggplot2, jsonlite"
    subhead: Starter environments (읽기 전용)
  - id: micromamba
    term: micromamba
    kind: value
    tier: full
    desc: micromamba(conda-forge, bioconda, defaults, pytorch) · pip/PyPI · CRAN·Bioconductor
    detail: |
      **패키지 소스를 다른 서버로 돌릴 수 없다** — 사내 미러가 필요하면 `config.toml` 의
      `[conda]` 미러 키를 쓴다. 패키지가 아예 없는 도구는 소스를 받아 샌드박스에서 conda-forge
      컴파일러로 빌드하고 **그 빌드를 아티팩트로 저장해 재사용**한다.
    see_also: [science/config-toml#network]
    subhead: 설치 소스
  - id: pip-install-install-packages
    term: 환경 설치 = 영구 / 셀 내 인라인 pip install·install.packages() = 커널 재시작까지만
    kind: note
    tier: full
    subhead: 설치 소스
  - id: task-environment-single-cell-structural-bi
    term: "Task environment(예: single-cell, structural-biology)는 필요 시 생성, 머신 전체 공유. 목록·삭제는 "
    kind: note
    tier: full
    desc: "Task environment(예: single-cell, structural-biology)는 필요 시 생성, 머신 전체 공유. 목록·삭제는 Claude에게 요청"
    detail: |
      스타터에 없는 패키지가 필요하면 Claude 가 기존 환경을 재사용하거나 새로 만들자고 제안하고,
      **승인 카드에 환경 이름과 초기 패키지가 표시된다.**
    subhead: 설치 소스
  - id: linux
    term: Linux만
    kind: value
    tier: full
    desc: GPU는 Linux 만 — Settings > Compute에서 활성화(샌드박스 강도 낮아짐)
    detail: |
      멀티 GPU 머신도 지원한다. GPU 가 없는 머신에서 GPU 가 필요한 작업이 오면 Claude 가 그 사실을
      알리고 **연결해 둔 원격 컴퓨트로 돌릴 수 있다.**
    caveat: GPU 접근을 허용하면 기본 샌드박싱 강도가 낮아진다 — 필요할 때만 켤 것.
    see_also: [science/slurm#slurm-2, science/modal#h100]
    subhead: 설치 소스
  - id: runtime-packages-2
    term: 주의
    kind: note
    tier: core
    pin: true
    tone: warn
    desc: apt·sudo·root 없음 — 패키지가 없으면 conda-forge 컴파일러로 소스 빌드
    subhead: 설치 소스
