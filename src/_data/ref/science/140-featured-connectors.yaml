  - id: featured-connectors-2
    term: 설명
    kind: note
    tier: full
    desc: "추가: BioMart, CellGuide(CELLxGENE), ZINC, Ketcher(2D 분자 스케처)"
    detail: |
      ZINC 는 구매 가능한 화학 공간, CellGuide 는 CELLxGENE 세포 유형이다.
      직접 추가한 커넥터는 이들과 달리 **도구마다 승인 카드가 뜬다**(Once·이 대화·이 프로젝트·Global).
