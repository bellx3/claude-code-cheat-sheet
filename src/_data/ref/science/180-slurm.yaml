id: slurm
title: SSH / Slurm 클러스터
group: compute
order: 180
sheet: science
aliases: [슬럼, 슬럼클러스터, slurm, 클러스터, 배치잡, sbatch]
summary: >-
  클러스터에 작업 제출.
source:
  url: https://claude.com/docs/claude-science/remote-compute-clusters
  checked_at: "2026-08-24"
items:
  - id: settings-compute-ssh-hosts-add-ssh-host
    term: Settings > Compute > SSH hosts > Add SSH host
    kind: value
    tier: full
    detail: |
      기존 `~/.ssh/config` 를 그대로 쓰고, 내 키나 `ssh-agent` 로 인증하며,
      **호스트에는 아무것도 설치하지 않는다.** 랩 워크스테이션이든 HPC 로그인 노드든 같다.
  - id: ssh-config-alias-user-port-proxyjump
    term: ~/.ssh/config의 alias 선택 (주소·user·port·ProxyJump 자동 인식)
    kind: note
    tier: full
  - id: partition-account-code-module-load-claude
    term: 호스트 메모 입력 (partition, account code, module load 등) — 첫 작업 전 Claude가 읽음
    kind: note
    tier: full
  - id: advanced
    term: Advanced
    kind: value
    tier: full
    desc: 에서 User/Port/Identity file 재정의 → Add
    detail: |
      `~/.ssh/config` 의 값을 그 호스트에 대해서만 덮어쓴다 — config 를 고치지 않고 예외를 두는 자리다.
  - id: slurm-1
    term: 설명
    kind: note
    tier: full
    desc: >-
      추가 시 read-only 프로브로 CPU/GPU/CUDA, conda·modules·Apptainer, scratch, sbatch 존재 여부 자동 탐지 (Probe로
      재실행)
    detail: |
      SLURM 클러스터면 파티션까지 읽는다. 결과는 호스트 상세 페이지의 **편집 가능한 메모**로 저장되고,
      Claude 가 작업하면서 이 Details 문서를 갱신한다 — 환경 활성화 방법, 데이터·패키지 위치,
      스케줄링 관례 같은 것이 여기 쌓인다.
  - id: slurm-2
    term: 설명
    kind: note
    tier: full
    desc: "실행: 워크스테이션=detached 프로세스, SLURM=sbatch. 연결 끊겨도 잡 유지"
    detail: |
      승인 카드에 **명령과 스크립트가 그대로 표시**되고, 승인하면 스크립트와 입력이 scratch 아래
      잡 디렉터리로 복사된다. Scratch 디렉터리는 **SLURM 이면 공유 파일시스템에 있어야** 한다.
  - id: slurm-3
    term: 설명
    kind: note
    tier: full
    desc: 기본 잡 타임아웃 30분, 동시 잡 100. 약 100MB 초과 출력은 호스트에 남고 경로만 기록
    detail: |
      **30분보다 오래 걸릴 작업은 제출 전에 미리 말해야 한다.** 끝나면 출력이 세션으로 당겨지지만,
      크기 임계치를 넘는 파일은 호스트에 남고 경로만 기록된다.
  - id: slurm-4
    term: 위험
    kind: note
    tier: core
    pin: true
    tone: danger
    desc: 원격 잡은 샌드박스 밖 — 내 계정 권한 전체로 실행됨. 호스트엔 아무것도 설치하지 않음
