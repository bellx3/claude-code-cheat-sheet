# legacy/cheatsheet-science.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: custom-skills
title: 커스텀 스킬 만들기
group: extend
order: 170
sheet: science
summary: >-
  직접 만드는 스킬.
source:
  url: https://claude.com/docs/claude-science/connectors-and-skills
  checked_at: "2026-08-24"
items:
  - id: add-skill
    term: Add skill
    kind: value
    tier: full
    desc: 버튼 → 4가지 방식
    detail: |
      Settings > Skills 의 **Add skill** 이다. 넷 중 어느 방식이든 결과는 같은 스킬 한 개다.
  - id: chat-with-claude
    term: Chat with Claude
    kind: value
    tier: full
    desc: 대화로 생성
  - id: write-from-scratch
    term: Write from scratch
    kind: value
    tier: full
    desc: 직접 작성
  - id: upload-a-skill
    term: Upload a skill
    kind: value
    tier: full
    desc: 파일 업로드
  - id: import-from-github
    term: Import from GitHub
    kind: value
    tier: full
    desc: private repo 가능(Settings > Credentials에 GitHub 토큰 추가 후)
    detail: |
      토큰은 `api.github.com` 레이트리밋 완화에도 쓰인다(`GITHUB_TOKEN` 환경변수로도 줄 수 있다).
      방화벽에서는 `api.github.com` 과 `codeload.github.com` 이 스킬 설치 경로다.
    see_also: [science/env-vars#github-token, science/firewall-domains#mcp-claude-com]
  - id: custom-skills-1
    term: 설명
    kind: note
    tier: full
    desc: 기존 세션의 워크플로를 스킬로 증류(distill)해 달라고 요청 가능
    detail: |
      한 번 잘 돌아간 분석 흐름을 다음에도 같은 방식으로 돌리게 만드는 가장 싼 길이다 —
      절차를 문서로 적어 두는 것보다 **실행되는 형태로 남기는 편**이 낫다.
