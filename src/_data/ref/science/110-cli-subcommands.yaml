# legacy/cheatsheet-science.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: cli-subcommands
title: CLI 서브커맨드
group: cli
order: 110
sheet: science
summary: >-
  터미널에서 쓰는 서브커맨드.
source:
  url: https://claude.com/docs/claude-science/command-line-settings
  checked_at: "2026-08-24"
items:
  - id: serve
    term: serve
    kind: value
    tier: core
    desc: 실행 + 1회용 로그인 링크 열기
    detail: |
      **데이터 디렉터리당 하나만 돌고** Ctrl-C 로 멈춘다. 평소 쓰는 명령은 이것 하나이고,
      나머지는 돌고 있는 프로그램을 관리하는 것들이다.
  - id: open
    term: open
    kind: value
    tier: core
    desc: 새 로그인 링크 발급 후 브라우저 열기
  - id: url
    term: url
    kind: value
    tier: core
    desc: 새 로그인 링크만 출력 (SSH용)
    detail: |
      링크의 nonce 는 **1회용 비밀번호**로 브라우저 탭 하나를 로그인시키고 약 3분 뒤 만료된다.
      로그인된 탭은 프로그램을 재시작할 때까지 유지되므로 **링크를 보관할 필요가 없다.**
    see_also: [science/remote-ssh#ssh-l-8000-localhost-8000]
  - id: status
    term: status
    kind: value
    tier: core
    desc: 실행 여부·버전·포트 JSON 출력
  - id: logs-tail
    term: logs [--tail]
    kind: value
    tier: core
    desc: 로그 출력 / 실시간 추적
  - id: stop
    term: stop
    kind: value
    tier: core
    desc: 정상 종료
  - id: update-check
    term: update [--check]
    kind: value
    tier: core
    desc: 업데이트 (--to <ver>로 롤백)
    detail: |
      `--check` 는 확인만 한다. 업데이트는 **서명 검증 후 바이너리를 원자적으로 교체**한다.
      특정 버전을 지정하는 `--to` 가 롤백 수단이기도 하다.
  - id: import-path
    term: import <path>
    kind: value
    tier: core
    desc: 다른 데이터 디렉터리 병합
    detail: |
      다른 데이터 디렉터리나 그 DB 파일을 이쪽으로 합친다. **같은 임포트를 두 번 돌리는 것은
      안전하다**(멱등) — 위험한 것은 되돌릴 수 없다는 점이다.
  - id: version
    term: "--version"
    kind: flag
    tier: core
    desc: 버전 출력
  - id: cli-subcommands-1
    term: 설명
    kind: note
    tier: full
    desc: "전역: --data-dir <dir>(기본 ~/.claude-science), --config <file>"
  - id: cli-subcommands-2
    term: 위험
    kind: note
    tier: core
    pin: true
    tone: danger
    desc: import는 미리보기·되돌리기 없음 — 사전 백업 필수
