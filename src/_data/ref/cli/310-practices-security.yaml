# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: practices-security
title: 실무 모범 사례 — 성능·보안
group: practice
order: 310
sheet: cli
summary: >-
  권한 확대 전에 피해 범위 축소를 먼저 검토.
source:
  url: https://code.claude.com/docs/en/security
  checked_at: "2026-08-24"
items:
  - id: clear
    term: 작업 전환마다 /clear로 컨텍스트 초기화
    kind: note
    tier: full
    detail: |
      비용 문제만이 아니다 — 이전 작업의 파일 내용이 남아 있으면 **다음 작업에서 엉뚱한 파일을
      고칠 위험**이 같이 생긴다. 이어가야 하는 대화라면 `/clear` 가 아니라 `/compact` 다.
    tasks: [shrink-context-cost, stop-touching-wrong-files]
  - id: max-turns
    term: "--max-turns로 무한 반복 방지"
    kind: note
    tier: full
    detail: |
      프린트 모드 전용이고 **한도에 닿으면 오류로 종료**한다. 돈으로 막는 쪽은
      `--max-budget-usd` 이고 서브에이전트 지출까지 합산된다 — 둘을 같이 거는 편이 안전하다.
    tasks: [ci-headless-run]
    see_also: [cli/new-flags#max-budget-usd]
  - id: compact
    term: 장기 대화는 /compact로 압축
    kind: note
    tier: full
    detail: |
      **압축은 정보를 잃는다.** 방금 확인한 실측 수치나 파일 내용이 요약에 날아가면 그 다음 판단이
      근거 없이 이뤄진다 — 중요한 숫자는 압축 전에 파일로 남긴다.
      자동 압축 기준은 `/autocompact` 나 `--autocompact` 로 정한다.
    tasks: [shrink-context-cost]
  - id: dangerously-skip-permissions
    term: "--dangerously-skip-permissions 사용 지양"
    kind: note
    tier: full
    detail: |
      확인이 잦은 것이 문제라면 순서가 있다 — ① `/fewer-permission-prompts` 로 **실제로 쓴
      읽기 전용 호출만** 허용 목록에 올리고 ② 필요한 것만 `--allowedTools` 로 열고
      ③ 격리가 필요하면 `/sandbox` 나 컨테이너를 쓴다.

      그래도 우회가 필요하면 `--allow-dangerously-skip-permissions` 로 **순환에만 넣어 두고**
      다른 모드로 시작하는 방법이 있다.
    tasks: [reduce-permission-prompts]
    see_also: [cli/cli-flags#allow-dangerously]
  - id: disallowedtools
    term: 위험 명령은 --disallowedTools로 상시 차단
    kind: note
    tier: full
    detail: |
      범위를 준 규칙이 낫다 — `Bash(rm *)` 처럼 쓰면 **Bash 는 남고 그 호출만 막힌다.**
      이름만 주면 도구가 컨텍스트에서 통째로 사라진다. 세션마다 다시 주지 않으려면
      설정 파일의 deny 규칙으로 올린다.
    see_also: [cli/cli-flags#disallowedtools]
  - id: practices-security-1
    term: 도구 권한 주기적 점검, 항상 최신 버전 유지
    kind: note
    tier: full
    detail: |
      `/permissions` 로 스코프별 규칙을 보고, 쓰지 않는 스킬·MCP 서버·플러그인은 `/doctor` 가
      **그 컨텍스트 비용과 함께** 지목해 준다. 버전은 `/doctor` 가 릴리스 채널을 보고 알려준다.
    tasks: [reduce-permission-prompts]
    see_also: [slash/info-diagnostics#doctor]
  - id: safe-mode-first
    term: 설정이 깨졌으면 --safe-mode 로 먼저 가른다
    kind: note
    tier: full
    detail: |
      내 커스터마이제이션(CLAUDE.md·스킬·플러그인·훅·MCP)이 원인인지 아닌지를 **한 번의 실행으로**
      가른다. `--safe-mode` 로 되면 원인은 내 설정 쪽이고, 그래도 안 되면 설치·인증·네트워크 쪽이다.
      속도를 위해 최소로 띄우는 `--bare` 와 목적이 다르다.
    tasks: [it-broke]
    see_also: [cli/new-flags#safe-mode]
