      **내 작업과 맞는지 확인된 바 없으므로 그대로 쓰기보다 필요한 것만 골라 다시 쓰는 편이 낫다.**

      원문은 `legacy/subagents/*.md` 에 그대로 남겨뒀다(MIT, 본문은 한국어).
      쓸 만한 게 있으면 거기서 가져와 `.claude/agents/` 에 두면 된다.
