# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: subagents
title: 서브에이전트 한눈에 보기
group: extend
order: 60
sheet: cli
summary: >-
  컨텍스트를 따로 쓰는 별도 에이전트. 실질 이점은 전문성이 아니라 격리 — 넓게 훑어야 하는데 결론만 필요할 때 본 대화가 무거워지지 않음.
source:
  url: https://code.claude.com/docs/en/sub-agents
  checked_at: "2026-08-13"
items:
  - id: subagents-1
    term: 설명
    kind: note
    tier: full
    desc: >-
      Task 도구로 호출: subagent_type=이름 · .claude/agents/*.md frontmatter(name/description/tools/model)로
      정의 · --agent/--agents 플래그로도 지정 가능
    detail: |
      **실질 이점은 전문성이 아니라 컨텍스트 격리다.** 탐색으로 파일 50개를 훑어야 하는데
      그 내용이 본 대화에 다 쌓이면 이후 작업이 계속 무거워진다. 서브에이전트에 맡기면
      결론만 돌아온다.

      쓸 자리는 셋이다 — 넓게 훑고 결론만 필요할 때, 같은 일을 여러 관점으로 각각 돌릴 때,
      실패해도 본 대화가 안 다쳐야 할 때. 반대로 맥락이 계속 이어져야 하는 작업은
      쪼개면 오히려 나빠진다.
    caveat: |
      결과는 요약이라 근거가 잘려 있다. 중요한 판정은 파일 경로와 재현 명령을 같이 요구하고,
      받은 뒤 직접 확인할 것.
    see_also: [cli/advanced-slash#agents, cli/new-flags#agent-agents]
    tasks: [split-work-across-agents]
