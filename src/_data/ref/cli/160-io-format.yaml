# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: io-format
title: 출력/입력 형식
group: automate
order: 160
sheet: cli
summary: >-
  사람이 읽는 출력 대신 기계가 파싱할 출력을 받는 축. 자동화의 출발점.
source:
  url: https://code.claude.com/docs/en/headless
  checked_at: "2026-08-13"
items:
  - id: output-format-json
    term: "--output-format json"
    kind: flag
    tier: core
    desc: JSON 출력 (스크립팅용)
    detail: |
      사람이 읽는 출력 대신 파싱 가능한 출력을 받는다. 자동화의 출발점이고,
      `jq` 로 바로 필드를 꺼낼 수 있다. 세션 ID 를 여기서 뽑아 다음 호출로 이어 붙이는 패턴이 흔하다.
    see_also: [cli/session-workflow#sid-claude-p-start-output-format-json]
    tasks: [ci-headless-run]
  - id: output-format-stream-json
    term: "--output-format stream-json"
    kind: flag
    tier: core
    desc: 실시간 처리용 스트림
    detail: |
      한 번에 다 받지 않고 오는 대로 처리한다. 오래 걸리는 작업의 진행을 보여줘야 하거나,
      출력이 커서 메모리에 다 올리기 곤란할 때 쓴다.
    tasks: [ci-headless-run]
  - id: input-format-stream-json
    term: "--input-format stream-json"
    kind: flag
    tier: core
    desc: 프린트 모드 입력 형식
  - id: json-schema-schema
    term: "--json-schema '<schema>'"
    kind: flag
    tier: core
    desc: 스키마 검증된 JSON 출력
    detail: |
      스키마를 주면 모델이 그 형태를 지키도록 강제되고, 어긋나면 재시도한다.
      `--output-format json` 만으로는 필드 이름이 흔들릴 수 있어서 파싱 코드가 깨진다.
      결과를 프로그램이 소비할 거면 이쪽이 맞다.
    tasks: [ci-headless-run]
  - id: p-max-turns-1
    term: "-p --max-turns 1 \"질의\""
    kind: flag
    tier: core
    desc: 배치/1회성 처리
