# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: new-flags
title: 신규 플래그 확장판
group: start
order: 120
sheet: cli
summary: >-
  비교적 최근에 붙은 플래그들. 문제 발생 시 원인을 좁히는 --safe-mode·--bare 가 특히 실전에서 유용.
source:
  url: https://code.claude.com/docs/en/cli-reference
  checked_at: "2026-08-24"
items:
  - id: permission-mode-mode
    term: "--permission-mode <mode>"
    kind: flag
    tier: core
    desc: 시작 권한 모드 지정
    aliases: [권한 모드]
    detail: |
      `default`·`acceptEdits`·`plan`·`auto`·`dontAsk`·`bypassPermissions` 를 받고,
      `manual` 은 `default` 의 별칭이다(UI 가 Manual 로 표기하는 그 모드, v2.1.200+).
      설정 파일의 `defaultMode` 를 덮어쓴다.
    see_also: [cli/permission-modes#default-manual]
  - id: agent-agents
    term: "--agent / --agents"
    kind: flag
    tier: core
    desc: 세션 에이전트 지정/JSON 정의
    detail: |
      `--agent` 는 이 세션이 쓸 에이전트를 정하고 `agent` 설정을 덮어쓴다.
      `--agents` 는 **파일을 만들지 않고 JSON 으로 서브에이전트를 정의**한다 —
      `--agents '{"reviewer":{"description":"Reviews code","prompt":"You are a code reviewer"}}'`.
    see_also: [cli/subagents#subagents-1]
  - id: safe-mode
    term: "--safe-mode"
    kind: flag
    tier: core
    desc: 커스터마이제이션 전체 비활성화
    aliases: [세이프 모드, 설정 격리]
    detail: |
      **설정이 깨졌을 때 원인을 가르는 도구다.** CLAUDE.md·스킬·플러그인·훅·MCP 서버·커스텀
      명령·에이전트·출력 스타일·워크플로·커스텀 테마·키바인딩·상태줄·LSP·자동 메모리가 전부 안 뜬다.

      인증·모델 선택·내장 도구·권한은 **정상 동작한다** — 이 점이 `--bare` 와 다르다.
    tasks: [it-broke]
    see_also: [cli/new-flags#bare]
  - id: bare
    term: "--bare"
    kind: flag
    tier: core
    desc: 훅·스킬·플러그인·MCP 생략
    aliases: [베어 모드, 빠른 시작]
    detail: |
      **목적이 진단이 아니라 속도다.** 훅·스킬·커스텀 명령·서브에이전트·플러그인·MCP 서버·
      자동 메모리·CLAUDE.md 의 자동 탐색을 건너뛰어 스크립트 호출이 빨리 시작된다.
      Bash·파일 읽기·파일 편집 도구는 남고, `--add-dir` 로 넘긴 디렉터리의 스킬은 여전히 로드된다.
      `CLAUDE_CODE_SIMPLE` 을 세운다.
    tasks: [ci-headless-run]
  - id: settings-path-json
    term: "--settings <path|json>"
    kind: flag
    tier: core
    desc: 설정 파일/인라인 JSON 지정
    detail: |
      여기서 준 키만 `settings.json` 의 같은 키를 이 세션에 대해 덮어쓴다 —
      **적지 않은 키는 파일 값을 그대로 쓴다.** 파일이면 일반 파일이어야 하고 2 MiB 를 넘을 수 없다.
  - id: autocompact-auto-tokens
    term: "--autocompact <auto|tokens>"
    kind: flag
    tier: core
    desc: 자동 컴팩트 기준 설정
    detail: |
      `/autocompact` 와 같은 값을 받되 **저장된 설정을 바꾸지 않고 이 세션에만** 적용한다
      (`claude --autocompact 500k`). v2.1.221+.
    tasks: [shrink-context-cost]
  - id: fallback-model
    term: "--fallback-model <목록>"
    kind: flag
    tier: core
    desc: 과부하 시 폴백 모델
    detail: |
      주 모델이 과부하이거나 없을 때(예: 은퇴한 모델) 넘어갈 모델을 **쉼표로 나열한 순서대로**
      시도한다. `fallbackModel` 설정을 덮어쓰고, 세션을 넘겨 유지하려면 그 설정에 적는다.
  - id: max-budget-usd
    term: "--max-budget-usd <금액>"
    kind: flag
    tier: core
    desc: 지출 상한 (프린트 모드)
    aliases: [예산, 비용 상한]
    detail: |
      프린트 모드 전용. **서브에이전트의 지출도 합산된다.** 상한에 닿으면 새 서브에이전트 생성이
      `Budget limit reached` 로 실패하고, 돌고 있던 백그라운드 서브에이전트도 중단된다(v2.1.217+).
    tasks: [shrink-context-cost, ci-headless-run]
  - id: system-prompt-file
    term: "--system-prompt[-file]"
    kind: flag
    tier: core
    desc: 시스템 프롬프트 교체/추가
    detail: |
      네 개가 짝을 이룬다 — `--system-prompt`(전체 교체) · `--system-prompt-file`(파일로 교체) ·
      `--append-system-prompt`(뒤에 덧붙임) · `--append-system-prompt-file`(파일 내용을 덧붙임).

      **교체는 기본 프롬프트를 통째로 버린다** — 도구 사용 규칙까지 사라지므로, 지침을 더하고
      싶은 것이라면 append 쪽이다.
  - id: mcp-config-plugin-dir
    term: "--mcp-config / --plugin-dir"
    kind: flag
    tier: core
    desc: MCP·플러그인 로컬 로드
    detail: |
      `--mcp-config` 는 JSON 파일·문자열에서 MCP 서버를 읽는다. `-p` 와 함께 쓰면 **첫 턴 전에
      아직 연결되지 않은 서버를 기다린다**(`MCP_TIMEOUT`, 기본 30초. 도구 목록이 캐시된 서버는
      기다리지 않는다).

      `--plugin-dir` 는 디렉터리나 `.zip` 에서 이 세션만 쓸 플러그인을 읽는다 —
      **플래그 하나에 경로 하나**이므로 여러 개면 반복해서 준다.
    tasks: [connect-external-tools]
  - id: strict-mcp-config
    term: "--strict-mcp-config"
    kind: flag
    tier: full
    desc: --mcp-config 의 서버만 사용
    detail: |
      다른 MCP 설정 전부를 무시한다. 재현 가능한 스크립트 실행에서 **내 개인 MCP 설정이
      섞여 들어오는 것을 막는** 용도다.
  - id: setting-sources
    term: "--setting-sources"
    kind: flag
    tier: full
    desc: 불러올 설정 출처 지정 (user·project·local)
    detail: |
      쉼표로 나열한다(`--setting-sources user,project`). CI 에서 개발자 로컬 설정을 빼고
      돌리고 싶을 때처럼, **어느 층까지 읽을지를 명시**할 수 있다.
  - id: json-schema
    term: "--json-schema"
    kind: flag
    tier: full
    desc: 스키마에 맞는 검증된 JSON 출력 (프린트 모드)
    detail: |
      작업이 끝난 뒤 JSON Schema 에 맞는 출력을 받는다. 스키마가 잘못되면 **오류로 종료**하므로
      파이프 뒤쪽이 깨진 JSON 을 받는 일이 없다. `format` 키워드는 주석으로만 받고 검증하지 않는다.
    tasks: [ci-headless-run]
  - id: cloud-teleport
    term: "--cloud / --teleport"
    kind: flag
    tier: full
    desc: 웹 세션 생성·지목 / 웹 세션을 터미널로
    aliases: [클라우드, 텔레포트]
    detail: |
      `--cloud` 에 작업 설명을 주면 claude.ai 에 새 웹 세션을 만들고, 세션 ID(`session_...`·
      `cse_...`)나 claude.ai/code URL 을 주면 **그 세션을 지목한다** — `-p` 면 메시지를 큐에 넣고,
      `-p` 가 없으면 내 터미널을 붙인다. `--remote` 는 이것의 옛 별칭이다.

      `--teleport` 는 반대 방향으로, 웹 세션을 로컬 터미널에서 이어받는다.
    see_also: [slash/collab-surfaces#teleport]
  - id: remote-control-flag
    term: "--remote-control, --rc"
    kind: flag
    tier: full
    desc: 원격 제어를 켠 대화형 세션
    detail: |
      claude.ai 나 Claude 앱에서도 조작할 수 있는 상태로 시작한다. 이름을 붙일 수도 있다.
      자동 생성 이름의 접두어는 기본이 호스트명이라
      `myhost-graceful-unicorn` 같은 이름이 된다.
    see_also: [slash/collab-surfaces#remote-control]
  - id: advisor-flag
    term: "--advisor <model>"
    kind: flag
    tier: full
    desc: 어드바이저 도구를 이 세션에서 켜기
    detail: |
      `fable`·`opus`·`sonnet` 또는 전체 모델 ID 를 받고, 이 세션에 대해 `advisorModel` 설정보다
      우선한다. `fable` 은 Fable 5 접근 권한이 필요하다.
    see_also: [slash/model-runtime#advisor-model-off]
  - id: exclude-dynamic-prompt
    term: "--exclude-dynamic-system-prompt-sections"
    kind: flag
    tier: full
    desc: 기기별 섹션을 첫 사용자 메시지로 옮겨 캐시 재사용률 높이기
    aliases: [프롬프트 캐시, 캐시 재사용]
    detail: |
      작업 디렉터리·환경 정보·메모리 경로·git 저장소 여부 같은 **기기마다 다른 조각**을 시스템
      프롬프트에서 빼 첫 사용자 메시지로 옮긴다. 같은 작업을 여러 사람·여러 기기가 돌릴 때
      프롬프트 캐시가 재사용된다.

      기본 시스템 프롬프트에만 적용되고 `--system-prompt[-file]` 을 주면 무시된다.
    tasks: [shrink-context-cost, ci-headless-run]
  - id: no-session-persistence
    term: "--no-session-persistence"
    kind: flag
    tier: full
    desc: 세션을 디스크에 남기지 않음 (프린트 모드)
    detail: |
      저장하지 않으므로 재개도 불가능하다. 어떤 모드에서든 같은 효과를 내는 환경변수는
      `CLAUDE_CODE_SKIP_PROMPT_HISTORY` 다.
