id: trouble-install
title: 트러블슈팅 — 설치
group: trouble
order: 340
sheet: cli
summary: >-
  설치·인증 문제는 doctor 로 상태를 먼저 읽고, 그래도 안 되면 네이티브 재설치.
source:
  url: https://code.claude.com/docs/en/troubleshoot-install
  checked_at: "2026-08-24"
items:
  - id: claude-version-claude-auth-status-claude-d
    term: claude --version && claude auth status && claude doctor
    kind: snippet
    tier: full
    desc: 예시
    detail: |
      `claude doctor` 가 설치 버전·인증 상태·`PATH`·파일 권한·프로젝트 구성·훅/스킬 상태를 한 번에
      점검한다. **추측 전에 이것부터** 돌리는 편이 빠르고, 출력을 그대로 지원 요청에 붙일 수 있다.

      설정이 원인인지 가르려면 `--safe-mode` 로 한 번 띄워 본다 — 그것으로 되면 내 커스터마이제이션
      쪽이고, 그래도 안 되면 설치·인증·네트워크 쪽이다.
    code: |-
      claude --version && claude auth status && claude doctor
      claude install stable         # 네이티브 재설치
      npm uninstall -g @anthropic-ai/claude-code
      npm install -g @anthropic-ai/claude-code   # npm 재설치
