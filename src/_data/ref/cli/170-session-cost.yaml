    term: "-p --max-turns 3"
    kind: flag
    tier: core
    desc: 프린트 모드 턴 수 제한
  - id: max-budget-usd-5-00
    term: "--max-budget-usd 5.00"
    kind: flag
    tier: core
    desc: 지출 상한 설정
  - id: verbose
    term: "--verbose"
    kind: flag
    tier: core
    desc: 상세 로그 출력
  - id: usage-cost
    term: /usage, /cost
    kind: command
    tier: core
    desc: 토큰 사용량·비용 표시
