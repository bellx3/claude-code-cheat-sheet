id: session-cost
title: 세션 제어 & 비용
group: control
order: 170
sheet: cli
summary: >-
  무한 반복으로 새어나가는 비용을 구조적으로 막는 장치들. 일회성 작업에는 상한 설정이 안전.
source:
  url: https://code.claude.com/docs/en/costs
  checked_at: "2026-08-13"
items:
