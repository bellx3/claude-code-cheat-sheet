id: custom-commands
title: 커스텀 슬래시 명령어
group: extend
order: 200
sheet: cli
summary: >-
  반복하는 지시를 파일 한 장으로 고정. 커스텀 명령은 스킬로 통합, 문법 동일.
source:
  url: https://code.claude.com/docs/en/skills
  checked_at: "2026-08-13"
items:
  - id: claude-commands-md
    term: .claude/commands/*.md
    kind: file
    tier: full
    desc: .claude/commands/*.md에 정의, frontmatter(name/description/aliases), 본문에 $ARGUMENTS 사용
    detail: |
      파일 한 장이면 `/명령` 하나가 생긴다. 프로젝트 전용이면 `.claude/commands/`,
      어디서나 쓰려면 `~/.claude/commands/`.

      **커스텀 명령은 스킬로 통합됐다.** `.claude/commands/deploy.md` 와
      `.claude/skills/deploy/SKILL.md` 는 둘 다 `/deploy` 를 만들고 동작이 같다.
      전자는 파일명이, 후자는 디렉터리명이 호출 이름이 된다. frontmatter 의 `name` 이
      호출 이름이 되는 건 플러그인 스킬뿐이다.

      인자 치환은 `$ARGUMENTS`(전체), `$1`·`$2`(위치 인자), 그리고 frontmatter 에
      `arguments: [issue, branch]` 를 선언하면 `$issue`·`$branch` 로 이름을 붙여 쓴다.
      리터럴 달러 기호는 백슬래시로 이스케이프한다.
    caveat: |
      Claude Code 는 frontmatter 키 20개를 받지만 claude.ai 업로드·Skills API 경로는
      name, description, license, compatibility, metadata, allowed-tools **6개만** 받고
      그 외 키가 있으면 무시가 아니라 **실패**한다. 밖으로 내보낼 파일이면 6개로 제한할 것.
    see_also: [slash/custom-commands#claude-commands-deploy-md-deploy]
    tasks: [ship-a-reusable-command]
  - id: debug-claude-commands-debug-md
    term: "/debug     # .claude/commands/debug.md"
    kind: snippet
    tier: full
    desc: 파일명이 그대로 명령 이름이 된다
    code: |-
      /debug     # .claude/commands/debug.md
      /test      # .claude/commands/test.md
      /deploy    # .claude/commands/deploy.md
    tasks: [ship-a-reusable-command]
