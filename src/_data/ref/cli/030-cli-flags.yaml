# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: cli-flags
title: CLI 플래그 전체 참조
group: start
order: 30
sheet: cli
summary: >-
  세션 시작 시 한 번 정하는 값들. 세션 안에서 바꿀 수 있는 것은 같은 이름의 슬래시 명령으로도 존재(--model ↔ /model). 자주 쓰는 것 위주로 골랐고, 플래그 80여 개의
  전체 목록은 공식 cli-reference 에 있다.
source:
  url: https://code.claude.com/docs/en/cli-reference
  checked_at: "2026-08-24"
items:
  - id: model
    term: "--model"
    kind: flag
    tier: core
    desc: 세션 모델 지정
    aliases: [모델 지정]
    detail: |
      최신 모델 별칭(`sonnet`·`opus`·`haiku`·`fable`) 또는 전체 모델 이름을 받는다.
      **`model` 설정과 `ANTHROPIC_MODEL` 환경변수를 모두 덮어쓴다.**
  - id: effort
    term: "--effort"
    kind: flag
    tier: core
    desc: 추론 강도 설정
    aliases: [추론 강도, ultracode]
    detail: |
      `low`·`medium`·`high`·`xhigh`·`max`·`ultracode` 중에서 고른다(모델에 따라 가용 범위가 다르다).
      `ultracode` 는 **xhigh 로 시작하면서 ultracode 를 켠** 상태다.
      `effortLevel` 설정을 이 세션에만 덮어쓰고 저장되지 않는다.
  - id: add-dir
    term: "--add-dir"
    kind: flag
    tier: core
    desc: 파일 접근용 작업 디렉토리 추가
    aliases: [디렉터리 추가]
    detail: |
      각 경로가 실제 디렉터리인지 검사한 뒤 읽기·편집 범위에 넣는다.
      **파일 접근만 늘어난다 — 그 디렉터리의 `.claude/` 설정은 대부분 읽지 않는다.**
      세션마다 다시 주지 않으려면 설정의 `permissions.additionalDirectories` 에 적는다.
    tasks: [stop-touching-wrong-files]
  - id: allowedtools
    term: "--allowedTools"
    kind: flag
    tier: core
    desc: 확인 없이 도구 허용
    aliases: [--allowed-tools, 허용 도구]
    detail: |
      **"확인 없이 실행"이지 "이 도구만 쓴다"가 아니다.** 도구 자체를 제한하려면 `--tools` 쪽이다.
      값은 권한 규칙 문법을 따른다 — `"Bash(git log *)" "Bash(git diff *)" "Read"`.
    tasks: [reduce-permission-prompts]
    see_also: [cli/cli-flags#tools]
  - id: disallowedtools
    term: "--disallowedTools"
    kind: flag
    tier: core
    desc: 특정 도구 금지
    aliases: [--disallowed-tools, 차단 도구]
    detail: |
      **이름만 주면 도구가 컨텍스트에서 사라지고, 범위를 주면 도구는 남고 그 호출만 막는다** —
      `"Edit"` 는 Edit 제거, `"*"` 는 전부 제거, `"mcp__*"` 는 MCP 도구 전부 제거,
      `Bash(rm *)` 는 Bash 는 남기고 `rm` 만 거부.
    tasks: [reduce-permission-prompts]
  - id: output-format
    term: "--output-format"
    kind: flag
    tier: core
    desc: 출력 형식 지정
    detail: |
      프린트 모드 전용. `text`·`json`·`stream-json`. 스크립트에서 결과를 파싱하려면 `json`,
      진행을 흘려 받으려면 `stream-json` 이다.
    tasks: [ci-headless-run]
  - id: input-format
    term: "--input-format"
    kind: flag
    tier: core
    desc: 입력 형식 지정
    detail: |
      프린트 모드 전용. `text`·`stream-json`. `stream-json` 으로 넣으면 작업 중에 보낸 메시지가
      **큐에 남아 자기 턴으로 실행된다**(그 턴은 자기 `--max-turns` 한도를 따로 갖는다).
  - id: max-turns
    term: "--max-turns"
    kind: flag
    tier: core
    desc: 에이전트 턴 수 제한
    detail: |
      프린트 모드 전용이고 기본값은 무제한이다. **한도에 닿으면 오류로 종료한다** —
      성공으로 끝나지 않으므로 스크립트가 조용히 잘린 결과를 쓰는 일은 없다.
    tasks: [ci-headless-run]
  - id: verbose
    term: "--verbose"
    kind: flag
    tier: core
    desc: 상세 로그 활성화
    detail: |
      턴 단위 출력을 전부 보여주고, 이 세션의 `viewMode` 설정을 덮어쓴다.
      `stream-json` 계열 플래그 몇 개는 이 플래그를 함께 요구한다.
  - id: continue-resume
    term: "--continue / --resume"
    kind: flag
    tier: core
    desc: 세션 이어가기 / 재개
    aliases: [-c, -r, 이어가기]
    detail: |
      `--continue` 는 현재 디렉터리의 가장 최근 대화를 불러오는데, **백그라운드 세션·`claude -p`·
      SDK·첫 프롬프트가 `/loop` 인 세션은 건너뛴다**(`claude -p --continue` 는 그것들도 포함한다).

      `--resume` 은 ID·이름으로 재개하거나 선택기를 연다. ID 를 주면 현재 프로젝트와 그 워크트리를
      먼저 찾고, 없으면 이 기기의 다른 프로젝트까지 찾는다(v2.1.223+).
      둘 다 `/add-dir` 로 이 디렉터리를 추가했던 세션까지 포함한다.
    tasks: [resume-yesterday]
  - id: from-pr
    term: "--from-pr"
    kind: flag
    tier: core
    desc: PR 연결 세션 재개
    detail: |
      특정 PR 에 연결된 세션만 걸러 선택기를 연다. PR 번호, GitHub·GitHub Enterprise PR URL,
      GitLab MR URL, Bitbucket PR URL 을 받는다. **Claude 가 PR 을 만들면 연결은 자동으로 걸린다.**
  - id: fork-session
    term: "--fork-session"
    kind: flag
    tier: core
    desc: 세션을 복사해 분기 후 재개
    detail: |
      `--resume`·`--continue` 와 함께 쓴다. 원래 세션 ID 를 재사용하지 않고 **새 ID 를 만든다** —
      원본을 남긴 채 다른 방향을 시험할 때 쓴다.
  - id: dangerously-skip-permissions
    term: "--dangerously-skip-permissions"
    kind: flag
    tier: core
    desc: 모든 권한 확인 생략
    aliases: [권한 생략, 위험]
    detail: |
      `--permission-mode bypassPermissions` 와 같다. **모든 것을 생략하는 것은 아니다** —
      어떤 모드도 자동 승인하지 않는 행위는 그대로 남는다.
      `--bg` 로 띄운 세션에서는 감독 프로세스가 재시작해도 이 모드가 유지된다.
    caveat: 컨테이너·VM 처럼 격리된 곳에서만 쓸 것. 권한 확인이 잦은 것이 문제라면 `--allowedTools` 나 `/fewer-permission-prompts` 가 답이다.
    see_also: [cli/cli-flags#allow-dangerously]
  - id: tools
    term: "--tools"
    kind: flag
    tier: full
    desc: 쓸 수 있는 내장 도구 자체를 제한
    aliases: [도구 제한]
    detail: |
      `--allowedTools` 와 축이 다르다 — 이쪽은 **도구의 존재 여부**를 정한다.
      `""` 는 전부 끄기, `"default"` 는 전부, `"Bash,Edit,Read"` 처럼 이름 나열도 된다.

      MCP 도구에는 영향이 없다 — 그쪽까지 막으려면 `--disallowedTools "mcp__*"` 를 같이 쓴다.
    see_also: [cli/cli-flags#allowedtools]
  - id: worktree
    term: "--worktree, -w"
    kind: flag
    tier: full
    desc: 격리된 git 워크트리에서 시작
    aliases: [워크트리, 격리, -w]
    detail: |
      `<repo>/.claude/worktrees/<name>` 에 워크트리를 만들어 그 안에서 시작한다.
      이름을 주지 않으면 자동 생성한다. **`#123` 이나 PR·MR URL 을 주면 그 PR 을 `origin` 에서
      가져와 거기서 분기한다.**

      `--tmux` 를 같이 주면 그 워크트리용 tmux 세션까지 만든다(iTerm2 가 있으면 네이티브 패널).
    tasks: [split-work-across-agents]
  - id: bg-background
    term: "--bg, --background"
    kind: flag
    tier: full
    desc: 백그라운드 에이전트로 시작하고 바로 반환
    aliases: [백그라운드, --background]
    detail: |
      세션 ID 와 관리 명령을 출력하고 즉시 돌아온다. `--agent` 와 함께 특정 서브에이전트로 띄우거나,
      `--exec` 와 함께 **Claude 세션이 아니라 셸 명령을 백그라운드 잡으로** 돌릴 수 있다
      (`claude --bg --exec 'pytest -x'`).
    caveat: '`-p`/`--print` 와 함께 쓸 수 없다.'
    tasks: [long-running-work]
  - id: name-session-id
    term: "--name / --session-id"
    kind: flag
    tier: full
    desc: 세션 표시 이름 / 세션 ID 지정
    aliases: [-n, 세션 이름]
    detail: |
      `--name`(`-n`) 은 `/resume` 목록과 터미널 제목에 뜨는 이름이고, 그 이름으로 재개할 수도 있다
      (`claude --resume <name>`). 같은 기기의 다른 세션이 쓰는 이름이면 변형된 이름이 붙는다.

      `--session-id` 는 대화에 쓸 ID 를 직접 정한다(유효한 UUID 여야 한다) — 스크립트가 나중에
      그 세션을 다시 찾아야 할 때 쓴다.
    tasks: [resume-yesterday]
  - id: debug
    term: "--debug / --debug-file"
    kind: flag
    tier: full
    desc: 디버그 모드 / 로그 파일 경로
    aliases: [디버그, 로그]
    detail: |
      범주를 걸러 볼 수 있다 — `--debug='mcp,startup'`, `--debug='!1p'`.
      **필터는 `=` 형태에서만 붙는다**(공백으로 주면 필터 없이 디버그만 켜진다).
      `--debug-file <path>` 는 파일로 쓰면서 디버그를 자동으로 켜고
      `CLAUDE_CODE_DEBUG_LOGS_DIR` 보다 우선한다.
    tasks: [it-broke]
  - id: allow-dangerously
    term: "--allow-dangerously-skip-permissions"
    kind: flag
    tier: full
    desc: bypass 를 Shift+Tab 순환에만 추가 (시작은 다른 모드)
    detail: |
      **바로 들어가지 않고 갈 수 있게만 열어 둔다.** `--permission-mode plan` 으로 시작해
      계획을 받은 뒤 필요할 때 `Shift+Tab` 으로 bypass 까지 돌릴 수 있다 —
      처음부터 우회 상태로 시작하는 `--dangerously-skip-permissions` 와 다르다.
    see_also: [cli/cli-flags#dangerously-skip-permissions]
