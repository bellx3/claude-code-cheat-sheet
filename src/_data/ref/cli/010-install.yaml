# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: install
title: 설치
group: start
order: 10
sheet: cli
summary: >-
  네이티브 설치가 권장 경로. npm 설치는 새로 깔 때 비권장 레거시. 문제 발생 시 추측 전에 claude doctor 먼저.
source:
  url: https://code.claude.com/docs/en/setup
  checked_at: "2026-08-13"
items:
  - id: curl-fssl-https-claude-ai-install-sh-bash
    term: curl -fsSL https://claude.ai/install.sh | bash
    kind: snippet
    tier: full
    desc: 예시
    code: |-
      # macOS/Linux/WSL
      curl -fsSL https://claude.ai/install.sh | bash
      # Windows PowerShell
      irm https://claude.ai/install.ps1 | iex
      # Homebrew / WinGet
      brew install --cask claude-code
      winget install Anthropic.ClaudeCode
  - id: claude-auth-login
    term: claude auth login
    kind: command
    tier: core
    desc: 로그인
  - id: claude-auth-status
    term: claude auth status
    kind: command
    tier: core
    desc: 인증 상태 확인
  - id: claude-auth-logout
    term: claude auth logout
    kind: command
    tier: core
    desc: 로그아웃
  - id: claude-doctor
    term: claude doctor
    kind: command
    tier: core
    desc: 설정 진단·문제 해결
    detail: |
      설치·인증·경로·권한 설정을 한 번에 점검한다. 문제 발생 시 추측 전에 이 명령을 먼저 돌리는 게
      시간을 절약한다. 출력을 복사해서 지원 요청에 쓸 수도 있다.

      점검 항목: 설치 버전, 인증 상태, PATH 설정, 파일 권한, 프로젝트 구성, 훅/스킬 상태.
