# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: install
title: 설치
group: start
order: 10
sheet: cli
summary: >-
  네이티브 설치가 권장 경로. npm 설치는 새로 깔 때 비권장 레거시. 문제 발생 시 추측 전에 claude doctor 먼저.
source:
  url: https://code.claude.com/docs/en/setup
  checked_at: "2026-08-24"
items:
  - id: curl-fssl-https-claude-ai-install-sh-bash
    term: curl -fsSL https://claude.ai/install.sh | bash
    kind: snippet
    tier: full
    desc: 예시
    detail: |
      설치 경로는 넷이다 — 설치 스크립트(macOS·Linux·WSL), PowerShell 스크립트(Windows),
      Homebrew cask, WinGet. **Windows 는 설치 직후 `PATH` 가 이미 열려 있던 터미널에 반영되지
      않으므로** 새 창을 열어야 한다.

      npm 설치가 꼬였으면 `claude install stable` 로 네이티브 바이너리를 다시 깔아 원인을 가른다.
    tasks: [first-setup]
    code: |-
      # macOS/Linux/WSL
      curl -fsSL https://claude.ai/install.sh | bash
      # Windows PowerShell
      irm https://claude.ai/install.ps1 | iex
      # Homebrew / WinGet
      brew install --cask claude-code
      winget install Anthropic.ClaudeCode
  - id: claude-auth-login
    term: claude auth login
    kind: command
    tier: core
    desc: 로그인
    detail: |
      `--email` 로 주소를 미리 채우고, `--sso` 로 SSO 를 강제하고, `--console` 로 구독 대신
      Anthropic Console(API 과금)로 붙는다.
    see_also: [cli/cli-commands#claude-auth]
  - id: claude-auth-status
    term: claude auth status
    kind: command
    tier: core
    desc: 인증 상태 확인
    detail: |
      **JSON 으로 출력하고 로그인 상태면 0, 아니면 1 로 종료한다**(`--text` 는 사람이 읽는 형태) —
      CI 에서 인증 여부를 판정하기에 이 종료 코드가 편하다.
    tasks: [ci-headless-run]
  - id: claude-auth-logout
    term: claude auth logout
    kind: command
    tier: core
    desc: 로그아웃
  - id: claude-doctor
    term: claude doctor
    kind: command
    tier: core
    desc: 설정 진단·문제 해결
    detail: |
      설치·인증·경로·권한 설정을 한 번에 점검한다. 문제 발생 시 추측 전에 이 명령을 먼저 돌리는 게
      시간을 절약한다. 출력을 복사해서 지원 요청에 쓸 수도 있다.

      점검 항목: 설치 버전, 인증 상태, PATH 설정, 파일 권한, 프로젝트 구성, 훅/스킬 상태.
