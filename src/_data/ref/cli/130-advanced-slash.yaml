# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
# 이 섹션은 CLI 쪽 진입점만 짧게 적고, 명령별 상세는 슬래시 서피스의 같은 항목으로 넘긴다
# (같은 내용을 두 곳에서 관리하면 한쪽이 낡는다).
id: advanced-slash
title: 신규/고급 슬래시 명령어
group: start
order: 130
sheet: cli
summary: >-
  되돌리기·검토·백그라운드처럼 상태를 크게 바꾸는 명령들. /rewind 는 커밋하지 않은 변경도 되돌림.
source:
  url: https://code.claude.com/docs/en/commands
  checked_at: "2026-08-24"
items:
  - id: rewind-turn
    term: /rewind [turn#]
    kind: command
    tier: core
    desc: 코드+대화 체크포인트 롤백
    aliases: [/checkpoint, /undo]
    detail: |
      대화만·코드만·둘 다를 고를 수 있다. **`git` 아래층이 아니라 위층이다** —
      커밋하지 않은 변경과 대화를 함께 맞춰 되돌린다.
    tasks: [undo-mistake]
    see_also: [slash/session-mgmt#rewind-turn]
  - id: agents
    term: /agents
    kind: command
    tier: core
    desc: 서브에이전트 관리
    detail: |
      v2.1.198 부터는 관리 화면이 아니라 **안내만 출력한다** — `.claude/agents/` 를 직접 편집하거나
      Claude 에게 만들라고 한다. 세션 단위로만 필요하면 `--agents` 로 JSON 을 넘길 수도 있다.
    see_also: [slash/system-extend#agents, cli/new-flags#agent-agents]
  - id: sandbox
    term: /sandbox
    kind: command
    tier: core
    desc: 격리 환경에서 실행
    detail: |
      지원 플랫폼에서만 보인다. 권한 확인이 잦다고 우회로 가는 대신 **격리로 위험을 낮추는** 쪽이다.
    see_also: [slash/system-extend#sandbox-action, cli/sandbox#sandbox]
  - id: permissions
    term: /permissions
    kind: command
    tier: core
    desc: 도구 권한 규칙 관리
    detail: |
      응답 중에 실행해도 즉시 열리고, 바꾼 규칙은 **같은 턴의 다음 도구 호출부터** 적용된다.
      데스크톱 앱에는 이 대화형 화면이 없다.
    tasks: [reduce-permission-prompts]
    see_also: [slash/system-extend#permissions]
  - id: plan
    term: /plan
    kind: command
    tier: core
    desc: 계획 모드 진입
    detail: |
      `Shift+Tab` 순환으로도 들어간다. 설명을 붙이면 그 작업으로 계획을 시작한다.
    see_also: [slash/plan-control#plan-description, cli/permission-modes#plan]
  - id: code-review-review
    term: /code-review, /review
    kind: command
    tier: core
    desc: 현재 diff·PR 검토
    detail: |
      강도(`low`~`max`·`ultra`)와 대상(PR 번호·브랜치·경로)을 인자로 받고, `--fix` 는 고침까지
      적용한다. `/review` 는 별칭이다.
    tasks: [review-before-merge]
    see_also: [slash/quality-security#code-review-level-fix]
  - id: security-review
    term: /security-review
    kind: command
    tier: core
    desc: diff 보안 취약점 검사
    detail: |
      커밋 안 된 변경이 아니라 **브랜치와 origin 기본 브랜치의 차이**를 본다 —
      `origin` 리모트가 없으면 실패한다.
    tasks: [review-before-merge]
    see_also: [slash/quality-security#security-review]
  - id: background-bg
    term: /background, /bg
    kind: command
    tier: core
    desc: 세션을 백그라운드로 분리
    detail: |
      터미널을 돌려받고 진행은 `claude agents` 로 확인한다. 처음부터 백그라운드로 띄우려면
      `claude --bg "..."` 다.
    tasks: [long-running-work]
    see_also: [slash/plan-control#background-prompt-bg, cli/cli-flags#bg-background]
  - id: tasks
    term: /tasks
    kind: command
    tier: core
    desc: 백그라운드 작업 목록
    aliases: [/bashes]
    detail: |
      **끝난 서브에이전트도 포함**되므로 결과를 놓쳤을 때 여기서 찾는다.
      응답 중에도 즉시 실행된다.
    see_also: [slash/plan-control#tasks]
  - id: fork
    term: /fork
    kind: command
    tier: core
    desc: 대화를 새 백그라운드 세션으로 복사
    detail: |
      복사본이 돌고 나는 여기 남는다. **에이전트 뷰를 끈 환경이나 v2.1.212 미만에서는
      포크된 서브에이전트로 동작한다** — 별도 세션이 아니라 이 대화에 결과가 붙는다.
    tasks: [split-work-across-agents]
    see_also: [slash/session-mgmt#fork-prompt]
  - id: loop
    term: /loop
    kind: command
    tier: core
    desc: 프롬프트 반복 실행
    aliases: [/proactive]
    detail: |
      간격을 생략하면 Claude 가 스스로 정하고, 프롬프트까지 생략하면 자율 점검이나
      `.claude/loop.md` 를 돌린다. `--continue` 는 첫 프롬프트가 `/loop` 인 세션을 건너뛴다.
    tasks: [long-running-work]
    see_also: [slash/plan-control#loop-interval-prompt]
  - id: goal
    term: /goal
    kind: command
    tier: core
    desc: 완료 조건 설정 후 자동 진행
    detail: |
      조건이 충족될 때까지 턴을 넘어 계속 간다. `clear`·`stop`·`off`·`reset`·`none`·`cancel`
      중 무엇으로든 해제한다.
    see_also: [slash/plan-control#goal-condition-clear]
  - id: recap
    term: /recap
    kind: command
    tier: core
    desc: 세션 한 줄 요약
    detail: |
      자리를 비웠다 돌아오면 자동으로 뜨는 그 요약을 필요할 때 직접 부르는 것이다.
      `/compact` 와 달리 대화를 건드리지 않는다.
    see_also: [slash/info-diagnostics#recap]
  - id: insights
    term: /insights
    kind: command
    tier: core
    desc: 세션 사용 패턴 분석
    detail: |
      이 기기의 최근 세션을 분석한 HTML 보고서를 만든다 — 클라우드 세션에서는 쓸 수 없다.
    see_also: [slash/info-diagnostics#insights]
