# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: model-effort
title: 모델 & 추론 설정
group: control
order: 140
sheet: cli
summary: >-
  작업 난이도에 맞춰 비용을 조절하는 축. 단순 반복에 최고 강도 불필요.
source:
  url: https://code.claude.com/docs/en/model-config
  checked_at: "2026-08-24"
items:
  - id: model-sonnet-opus-haiku-fable
    term: "--model sonnet/opus/haiku/fable"
    kind: flag
    tier: core
# desc 에 가운뎃점(·) 연쇄를 쓰지 말 것 — ·는 줄바꿈 지점이 아니라 A3 표에서 한 덩어리로
# 굳어 지면을 밀어낸다(실측: 1661px>1587px 가로 넘침). 쉼표+공백은 꺾인다.
    desc: "별칭 전체: default, best, fable, sonnet, opus, haiku, sonnet[1m], opus[1m], opusplan"
    detail: |
      `default` 는 오버라이드 해제(계정 기본으로 복귀), `best` 는 조직에 Fable 5 가 있으면
      Fable, 없으면 최신 Opus. `[1m]` 접미사는 100만 토큰 컨텍스트 창,
      `opusplan` 은 plan 모드에서 opus·실행에서 sonnet 을 쓰는 혼합 모드다.
  - id: model-claude-sonnet-5
    term: "--model claude-sonnet-5"
    kind: flag
    tier: core
    desc: 특정 모델 버전 지정
    detail: |
      별칭 대신 전체 이름을 박으면 **모델이 갱신돼도 그 버전에 고정된다** — 재현이 중요한
      스크립트·평가에서 쓴다. 대신 은퇴하면 실패하므로 `--fallback-model` 을 같이 걸어 둔다.
    see_also: [cli/new-flags#fallback-model]
  - id: effort-level
    term: "--effort <level>"
    kind: flag
    tier: core
    desc: low, medium, high, xhigh, max — 기본 high, max 는 세션 한정
    detail: |
      모델이 지원 안 하는 레벨을 주면 그 아래 최고 지원 레벨로 폴백한다.
      low~xhigh 는 대화형 세션에서 설정하면 세션 간 유지되고, `max` 는
      `CLAUDE_CODE_EFFORT_LEVEL` 환경변수로 주지 않는 한 현재 세션에만 적용된다.
      (ultracode 는 effort 레벨이 아니라 워크플로 오케스트레이션 키워드다 — 2026-08-20 정정)
  - id: advisor-opus
    term: "--advisor opus"
    kind: flag
    tier: core
    desc: 어드바이저 모델 활성화
    detail: |
      중요한 지점에서 **두 번째 모델에게 조언을 구하는** 도구를 이 세션에서 켠다.
      `advisorModel` 설정보다 우선한다. 별도 모델 호출이라 그만큼 비용이 늘어난다.
    see_also: [cli/new-flags#advisor-flag]
  - id: model-effort
    term: /model, /effort
    kind: command
    tier: core
    desc: 세션 내 변경
    detail: |
      `/model` 은 **새 세션의 기본값으로도 저장된다** — 이번 세션만 바꾸려면 선택기에서 그 줄에
      `s` 를 누른다. `Alt+P`(모델)로 프롬프트를 비우지 않고 바꿀 수도 있다.
    see_also: [cli/keybindings#alt-p-option-p]
