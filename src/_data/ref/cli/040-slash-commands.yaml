# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: slash-commands
title: 슬래시 명령어 전체 참조
group: start
order: 40
sheet: cli
summary: >-
  세션 안에서 치는 명령. 대화 흐름을 끊지 않고 상태를 바꾸거나 확인할 때 사용.
source:
  url: https://code.claude.com/docs/en/commands
  checked_at: "2026-08-24"
items:
  - id: help
    term: /help
    kind: command
    tier: core
    desc: 도움말 표시
    detail: |
      사용 가능한 슬래시 명령어 전체 목록과 간단한 설명을 보여준다. 명령어 이름을 까먹었을 때 빠르게 찾을 수 있다.
  - id: init
    term: /init
    kind: command
    tier: core
    desc: 코드베이스 분석해 CLAUDE.md 생성/개선
    detail: |
      이미 CLAUDE.md 가 있으면 덮어쓰지 않고 개선을 제안한다. `CLAUDE_CODE_NEW_INIT=1` 을
      설정하면 스킬·훅까지 묻는 대화형 흐름이 되고, 다른 코딩 에이전트의 설정을 발견하면
      `/import` 로 옮기길 제안한다.
    tasks: [onboard-unknown-repo, first-setup]
  - id: exit
    term: /exit
    kind: command
    tier: core
    desc: CLI 종료(별칭 /quit · 백그라운드는 분리)
    detail: |
      백그라운드 세션에 붙어 있을 때는 **세우지 않고 빠져나온다** — 세우려면 `/stop` 이다.
  - id: clear-name
    term: /clear [name]
    kind: command
    tier: core
    desc: 새 대화 시작
    detail: |
      이름을 붙여 두면 `/resume` 목록에서 방금 자른 대화를 알아볼 수 있다.
      **이어가면서 자리만 확보하려면 `/compact`** 다. 별칭은 `/reset`·`/new`.
    tasks: [shrink-context-cost, stop-touching-wrong-files]
    see_also: [slash/session-mgmt#clear-name]
  - id: compact
    term: /compact [지시]
    kind: command
    tier: core
    desc: 대화 요약, 컨텍스트 확보
    detail: |
      지금까지의 대화를 요약해서 컨텍스트를 줄인다. 선택적으로 계속할 지시를 입력하면
      요약된 상태에서 이어서 작업한다. 긴 대화가 느려졌을 때 유용하다.
  - id: context-all
    term: /context [all]
    kind: command
    tier: core
    desc: 컨텍스트 사용량 표시
    detail: |
      **비용이 아니라 컨텍스트 분포**를 색 격자로 보여준다(비용은 `/usage`·`/cost` 쪽이다).
      컨텍스트를 많이 쓰는 도구, 비대해진 메모리 파일, 한계 임박 경고가 함께 뜬다.

      전체화면 모드에서는 격자를 살리려고 항목별 내역을 접는데, `all` 을 주면 펼친다.
    tasks: [shrink-context-cost]
    see_also: [cli/slash-commands#usage-cost]
  - id: config
    term: /config
    kind: command
    tier: core
    desc: 설정 패널 열기
    detail: |
      `key=value` 를 넘기면 화면을 열지 않고 값만 바꾼다(`/config thinking=false`,
      `/config theme=dark`). `/config --help` 로 설정 가능한 키 전체를 볼 수 있다.
    see_also: [slash/settings-personal#config-key-value]
  - id: status
    term: /status
    kind: command
    tier: core
    desc: 세션 상태·진행 작업 표시
    detail: |
      버전·모델·계정·연결 상태를 보여주고 **응답 중에도 즉시 실행된다.**
  - id: doctor
    term: /doctor
    kind: command
    tier: core
    desc: 설정 진단 및 문제 해결
    detail: |
      설치·`PATH`·설정 파일 파싱을 점검하고 **고치기까지** 한다. 쓰지 않는 스킬·MCP·플러그인을
      컨텍스트 비용과 함께 지목하고, 커진 `CLAUDE.md` 를 덜어내는 제안도 한다.
      세션을 열지 않고 읽기 전용으로만 보려면 셸에서 `claude doctor` 다.
    tasks: [it-broke, first-setup]
    see_also: [cli/cli-commands#claude-doctor-cli]
  - id: usage-cost
    term: /usage, /cost
    kind: command
    tier: core
    desc: 토큰 사용량·비용 표시
    detail: |
      유료 플랜에서는 스킬·서브에이전트·플러그인·MCP 서버별 내역까지 쪼개 준다.
      `/stats` 도 같은 것이다. **플랜 사용량은 터미널·데스크톱·웹이 공유한다.**
    tasks: [shrink-context-cost]
  - id: model-model
    term: /model [model]
    kind: command
    tier: core
    desc: 세션 내 모델 변경
    detail: |
      **새 세션의 기본값으로도 저장된다** — 이번 세션만 바꾸려면 선택기에서 그 줄에 `s` 를 누른다.
      좌우 화살표로 추론 강도까지 같이 조정한다.
    see_also: [slash/model-runtime#model-model]
  - id: effort-level-auto
    term: /effort [level|auto]
    kind: command
    tier: core
    desc: 추론 강도 조정
    detail: |
      `low`~`xhigh`·`max`·`ultracode`·`auto`. `status` 는 현재 값을 찍는다.
      `max` 와 `ultracode` 는 세션 한정이다.
    see_also: [slash/model-runtime#effort-level-auto]
  - id: resume
    term: /resume
    kind: command
    tier: core
    desc: 다른 대화로 돌아가기
    detail: |
      백그라운드 세션은 `bg` 로 표시되고 **아직 돌고 있는 것은 여기서 재개할 수 없다** —
      `claude agents` 에서 붙거나 거기서 먼저 세운다.
    tasks: [resume-yesterday]
  - id: rename-name
    term: /rename [name]
    kind: command
    tier: core
    desc: 현재 세션 이름 변경
    detail: |
      이름을 생략하면 대화 이력에서 자동 생성한다. 제어문자는 공백으로 치환되고 200자에서 잘린다.
  - id: branch-name
    term: /branch [name]
    kind: command
    tier: core
    desc: 현재 지점에서 대화 분기
    detail: |
      분기 쪽으로 **들어간다.** 원본은 남고 `/resume` 으로 돌아온다.
      복사본을 백그라운드로 띄우고 나는 남으려면 `/fork`, 곁가지를 맡기려면 `/subtask`.
    see_also: [slash/session-mgmt#branch-name]
  - id: export-filename
    term: /export [filename]
    kind: command
    tier: core
    desc: 대화를 텍스트로 내보내기
    detail: |
      파일명을 주면 바로 쓰고, 없으면 클립보드 복사·파일 저장을 고르는 대화상자가 열린다.
  - id: diff
    term: /diff
    kind: command
    tier: core
    desc: 변경사항 대화형 뷰어
    detail: |
      커밋 안 된 변경과 **턴별 diff** 를 좌우 화살표로 넘겨 본다.
      git blob 원본에서 계산하므로 `.gitattributes` 의 diff 드라이버는 적용되지 않는다.
    tasks: [review-before-merge]
    see_also: [slash/session-mgmt#diff]
  - id: ide
    term: /ide
    kind: command
    tier: core
    desc: IDE 연동 관리·상태 표시
    detail: |
      시작할 때 자동으로 붙이려면 `claude --ide` 인데, **유효한 IDE 가 정확히 하나일 때만** 붙는다.
    see_also: [cli/ide#ide-ide]
  - id: mcp
    term: /mcp
    kind: command
    tier: core
    desc: MCP 서버 연결 관리
    detail: |
      `reconnect <server>` 로 끊긴 하나만 다시 붙이고, `enable`/`disable` 에 이름이나 `all` 을 주면
      대화상자 없이 상태만 바꾼다. `-p` 에서는 목록 대신 상태 요약을 텍스트로 찍는다.
    tasks: [connect-external-tools]
    see_also: [slash/system-extend#mcp-subcommand]
