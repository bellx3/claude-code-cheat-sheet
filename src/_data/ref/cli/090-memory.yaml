id: memory
title: 메모리 & CLAUDE.md
group: control
order: 90
sheet: cli
aliases: [메모리, CLAUDE.md, 기억, 프로젝트 규칙, memory]
summary: >-
  프로젝트 규칙·빌드 명령·하지 말 것을 적어두는 자리. 이게 없으면 매 세션 같은 설명 반복.
source:
  url: https://code.claude.com/docs/en/memory
  checked_at: "2026-08-20"
items:
  - id: memory-1
    term: 설명
    kind: note
    tier: full
    desc: "로드 순서: managed policy → ~/.claude/CLAUDE.md → ./CLAUDE.md → CLAUDE.local.md"
    detail: |
      뒤에 오는 것이 앞을 덮는 게 아니라 **전부 함께 로드**된다. 그래서 층을 나눠 쓴다 —
      전역(`~/.claude/CLAUDE.md`)에는 어느 프로젝트에서나 통하는 내 작업 방식,
      프로젝트(`./CLAUDE.md`)에는 이 리포의 규칙, `CLAUDE.local.md` 에는 커밋하지 않을 개인 메모.

      managed policy 는 조직이 배포하는 것이라 개인 설정으로 뒤집을 수 없다.

      상위 디렉터리의 CLAUDE.md 는 시작 시 전부 로드되지만, **하위 디렉터리의 것은
      그 디렉터리 파일을 읽을 때** 비로소 로드된다.
    caveat: |
      `CLAUDE.local.md` 는 `.gitignore` 에 넣을 것. 로컬 경로나 개인 메모가 그대로 커밋된다.
    see_also: [cli/enterprise#enterprise-1]
    tasks: [onboard-unknown-repo, first-setup]
  - id: path-to-file
    term: "@path/to/file"
    kind: value
    tier: full
    desc: "@path/to/file 로 다른 문서 import(최대 4단계)"
    detail: |
      CLAUDE.md 가 길어지면 `@docs/architecture.md` 처럼 쪼개 넣는다. **최대 4단계**까지
      중첩 import 된다.

      쪼개는 기준은 "매 세션 필요한가"다. 항상 필요한 것만 CLAUDE.md 본문에 두고,
      가끔 필요한 것은 별도 파일로 두었다가 그때만 `@` 로 붙이는 편이 컨텍스트를 아낀다.
    tasks: [shrink-context-cost]
  - id: memory
    term: /memory
    kind: command
    tier: full
    desc: "/memory 로 편집 · Auto Memory: 학습 내용을 스스로 기록"
    detail: |
      `/memory` 는 어느 CLAUDE.md 를 고칠지 고르는 편집기를 연다.
      Auto Memory 는 작업 중 알게 된 것을 Claude 가 스스로 기록하는 기능이다.

      자동 메모리는 기본 켜짐 — `/memory` 안의 토글이나 `autoMemoryEnabled` 설정으로 끈다.
      저장 위치는 `~/.claude/projects/<프로젝트>/memory/` 이고 **git 저장소 단위**라
      같은 리포의 worktree 들이 하나를 공유한다(머신 로컬, 클라우드 미공유).
      인덱스 `MEMORY.md` 는 매 세션 **처음 200줄/25KB만** 로드되므로 짧게 유지해야 한다.

      실무 팁 — 탐색을 마친 직후가 가장 좋은 기록 시점이다. 그때 적어두지 않으면
      다음 세션에서 같은 탐색을 처음부터 반복하게 된다.
    see_also: [cli/slash-commands#clear-name]
    tasks: [onboard-unknown-repo]
