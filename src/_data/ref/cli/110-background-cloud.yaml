id: background-cloud
title: 백그라운드 에이전트 & 클라우드
icon: 🖥
group: run
order: 110
sheet: cli
aliases: [백그라운드, background, 클라우드, cloud, 병렬, 텔레포트]
summary: >-
  세션을 붙잡고 기다릴 필요가 없는 작업을 떼어내는 층. 떼어내는 방식이 셋이고,
  "지금 대화를 분리할 것인가 / 새로 띄울 것인가 / 기기를 옮길 것인가"로 갈린다.
source:
  url: https://code.claude.com/docs/en/agents
  checked_at: "2026-08-13"
items:
  - id: claude-bg
    term: "claude --bg \"작업 지시\"        # 백그라운드 실행"
    kind: snippet
    tier: full
    desc: 백그라운드·클라우드 세션 명령 모음
    code: |-
      claude --bg "작업 지시"        # 백그라운드 실행
      claude agents                  # 목록/대시보드
      claude attach|logs|stop <id>   # 연결/로그/중지
      claude respawn <id>            # 재시작
      claude --cloud "작업"          # 웹 세션 생성
      claude --teleport              # 웹 세션→로컬 이동
    detail: |
      `--bg` 는 처음부터 세션에 묶이지 않게 띄운다. `claude agents` 로 목록을 보고
      `attach` 로 붙었다가 떼어낼 수 있다. 진행만 보려면 `logs`.

      `--cloud` 는 실행 자체를 웹으로 올린다. 노트북을 닫아도 계속 돌고,
      나중에 `--teleport` 로 로컬로 가져온다. 오래 걸리는 작업을 퇴근길에 걸어둘 때 쓰는 경로다.
    caveat: |
      백그라운드 작업도 토큰을 쓴다. 여러 개를 걸어두면 사용량이 **눈에 안 보이는 채로** 늘어난다.
      일회성 작업에는 `--max-turns` 를 걸고 `/usage` 로 주기적으로 확인할 것.
    see_also: [cli/advanced-slash#tasks, cli/session-cost#p-max-turns-3]
    tasks: [long-running-work]
  - id: background
    term: /background
    kind: command
    tier: full
    desc: /background(/bg), /tasks 로 세션 내 관리
    detail: |
      이미 진행 중인 대화를 떼어낼 때 쓴다. `--bg` 가 "처음부터 백그라운드"라면
      `/background` 는 "하던 걸 백그라운드로". `/tasks` 로 목록을, `Ctrl+T` 로 토글한다.

      비슷해 보이지만 다른 것 — `/fork` 는 대화를 **복사해** 새 백그라운드 세션을 만든다.
      원본을 남겨두고 다른 접근을 병렬로 시험할 때 이쪽이다.
    see_also: [cli/advanced-slash#fork, cli/keybindings#ctrl-t]
    tasks: [long-running-work, split-work-across-agents]
