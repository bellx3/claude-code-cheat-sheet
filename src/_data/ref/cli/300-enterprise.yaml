# legacy/cheatsheet.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: enterprise
title: 엔터프라이즈 관리
group: enterprise
order: 300
sheet: cli
summary: >-
  조직이 배포하는 managed-settings.json 이 최상단, 개인 설정으로 뒤집기 불가.
source:
  url: https://code.claude.com/docs/en/settings
  checked_at: "2026-08-13"
items:
  - id: enterprise-1
    term: 설명
    kind: note
    tier: full
    desc: >-
      설정 우선순위: managed-settings.json > CLI 인자 > .claude/settings.local.json > .claude/settings.json
      > ~/.claude/settings.json
    detail: |
      **managed-settings.json 이 최상단이라 개인 설정으로 뒤집을 수 없다.** 조직이 배포하는 정책이고,
      그 아래로 CLI 인자 → 프로젝트 local → 프로젝트 → 사용자 순이다.
      
      개인 프로젝트에서 이 순서가 중요한 이유는 따로 있다 — `.claude/settings.local.json` 이
      `.claude/settings.json` 을 덮으므로, 팀과 공유할 규칙은 local 이 아닌 쪽에 둬야 한다.
    see_also: [cli/memory#memory-1]
  - id: enterprise-2
    term: 설명
    kind: note
    tier: full
    desc: auto 모드는 프로덕션 배포·강제 푸시·시크릿 유출 등을 기본 차단
  - id: sandbox-network-alloweddomains
    term: sandbox.network.allowedDomains
    kind: value
    tier: full
    desc: sandbox.network.allowedDomains 로 아웃바운드 도메인 제한
    detail: |
      나가는 트래픽을 도메인 화이트리스트로 막는다. MCP 커넥터나 스크립트가 예상 밖의 곳으로
      데이터를 보내는 경로를 차단하는 가장 직접적인 수단이다.
    see_also: [cli/sandbox#sandbox]
    tasks: [stop-touching-wrong-files]
