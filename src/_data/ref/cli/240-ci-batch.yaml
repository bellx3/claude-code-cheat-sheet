id: ci-batch
title: CI 연동 & 배치 처리
icon: 🟤
group: automate
order: 240
sheet: cli
summary: >-
  CI 에서 돌릴 때는 결과를 파싱 가능한 형식으로 받고, 실패가 조용히 지나가지 않게 한다.
source:
  url: https://code.claude.com/docs/en/github-actions
