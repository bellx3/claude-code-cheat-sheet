# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: background-tasks
title: 백그라운드 작업 & 세션 간 작업
group: run
order: 190
sheet: desktop
summary: >-
  오래 걸리는 작업을 떼어내고 다른 일 병행.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: tasks
    term: "Tasks 패널: 서브에이전트·백그라운드 셸·동적 워크플로우 진행상황"
    kind: note
    tier: full
    detail: |
      **현재 세션 안에서** 도는 것들만 모인다. Views 메뉴에서 열거나 배치에 끌어다 둔다.
      항목을 클릭하면 subagent 패널에서 출력을 보거나 그 자리에서 세울 수 있다.

      다른 세션이 무엇을 하는지는 사이드바를 보거나 Claude 에게 물어야 한다.
    see_also: [desktop/background-tasks#code]
  - id: code
    term: "\"다른 세션이 뭐 했어?\" 같은 자연어로 다른 Code 세션 확인·메시지·이름변경·보관 요청"
    kind: note
    tier: full
    detail: |
      "인증 리팩터를 건드린 세션이 뭐야?", "API 세션은 어떤 결론을 냈어?",
      "결제 세션에 스키마 바뀌었다고 전해줘" 처럼 말로 시킨다. 메시지는 받는 쪽에 **보낸 세션의
      제목과 되돌아가는 링크가 붙은 카드**로 뜨고, 받는 세션이 작업 중이면 그 턴이 끝난 뒤 읽는다.

      안전 장치가 넷 있다 — ① 보관은 **모든 권한 모드에서** 먼저 승인을 묻는다(Auto·Bypass 포함)
      ② 아무도 보고 있지 않은 세션(예약 실행 등)에서는 보내지도 받지도 못한다
      ③ 받는 쪽의 `crossSessionInbound: refuse` 설정이 우선한다
      ④ 들어온 메시지는 인용되고 보낸 세션이 명시된다.
    caveat: 보관된 세션에는 전달되지 않는다 — 전달 실패는 알려 준다.
  - id: "20"
    term: 최근 20개 세션까지, 클라우드 세션은 제외
    kind: note
    tier: full
    detail: |
      **데스크톱 앱이 직접 돌리는 세션만 보인다** — Code 탭의 로컬·SSH·WSL 세션.
      클라우드 세션, 터미널 CLI 로 띄운 세션, VS Code 확장의 세션은 같은 프로젝트의 워크트리라도
      보이지 않는다(터미널 워크트리 9개와 데스크톱 세션 2개가 열려 있으면, 한쪽에서 물었을 때
      나머지 데스크톱 세션 1개만 답한다).

      기본은 최근 활동 20개이고 보관된 것은 요청해야 포함된다. **지금 묻고 있는 세션 자신은
      절대 목록에 넣지 않는다.** 터미널 세션까지 메시지를 보내려면 교차 세션 메시징 쪽이다.
    see_also: [slash/system-extend#list-agents]
  - id: task-chip
    term: 작업 칩 (task chip)
    kind: value
    tier: full
    desc: 범위를 벗어난 발견을 새 세션으로 떼어내는 제안
    aliases: [칩, 새 세션 제안]
    detail: |
      현재 작업 범위를 벗어나지만 고칠 만한 것을 발견하면 Claude 가 **칩으로 제안**한다.
      누르면 자기 워크트리를 가진 새 세션에서 그 일이 시작되고, 지금 세션은 끊기지 않는다.
      본 작업의 diff 를 부풀리지 않고 발견을 남기는 장치다.
