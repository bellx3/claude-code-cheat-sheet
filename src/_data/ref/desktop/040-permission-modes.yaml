# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: permission-modes
title: 권한 모드
group: control
order: 40
sheet: desktop
summary: >-
  CLI 와 같은 개념, UI 라벨 표기만 차이. API 식별자 대조 필요 시 CLI 시트 참고.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: manual-default
    term: Manual (default)
    kind: value
    tier: core
    desc: 편집·명령 전 항상 확인
    aliases: [default, 수동, 항상 확인]
    detail: |
      설정 키는 `default`. 편집·명령 전에 매번 묻고, diff 를 보고 건별로 수락·거부한다.
      예전 버전에서는 이 모드가 **Ask permissions** 라는 이름이었다.
  - id: accept-edits
    term: Accept edits
    kind: value
    tier: core
    desc: 파일편집+기본 명령 자동승인
    aliases: [acceptEdits, 편집 자동 승인]
    detail: |
      설정 키는 `acceptEdits`. 파일 편집과 `mkdir`·`touch`·`mv` 같은 기본 파일시스템 명령은
      자동 승인하고, **그 밖의 터미널 명령은 여전히 묻는다.** 예전 이름은 Auto accept edits.
  - id: plan
    term: Plan
    kind: value
    tier: core
    desc: 탐색만, 편집 전 계획 제시
    aliases: [계획 모드, plan mode]
    detail: |
      설정 키는 `plan`. 파일을 읽고 명령으로 탐색하되 **소스는 고치지 않고 계획을 제시**한다.
      복잡한 작업은 Plan 으로 시작해 접근을 합의한 뒤 Accept edits 나 Manual 로 옮겨 실행하는
      순서가 권장된다. 폴더별 기억 대상이 아니라 현재 세션에만 적용된다.
  - id: auto
    term: Auto
    kind: value
    tier: core
    desc: 백그라운드 안전검사로 대부분 자동
    aliases: [오토 모드, 자동]
    detail: |
      설정 키는 `auto`. 요청과의 정합성을 백그라운드 분류기가 검사하면서 대부분을 자동 실행한다 —
      **감독을 유지한 채 확인 횟수만 줄이는 쪽**이다.

      계정 조건을 만족하면 선택기에 나타나고 **별도 설정 토글은 없다.** Anthropic API 에서는
      전체 사용자에게 열려 있고 Opus 4.6+ · Sonnet 4.6+ · Fable 5 가 필요하다.
      조직은 `disableAutoMode` 로 끌 수 있다.
  - id: bypass-permissions
    term: Bypass permissions
    kind: value
    tier: core
    desc: 프롬프트 없음, 격리 환경 전용
    aliases: [bypassPermissions, 우회]
    detail: |
      설정 키는 `bypassPermissions`, CLI 의 `--dangerously-skip-permissions` 와 같다.
      그래도 **예외는 남는다** — 어떤 모드도 자동 승인하지 않는 행위, 외부 사이트에서의 안전 분류기,
      세션 보관처럼 데스크톱이 항상 먼저 묻는 조작.
    caveat: 샌드박스 컨테이너나 VM 에서만 쓸 것. 클라우드 세션에서는 아예 제공되지 않는다(자체 호스팅 환경 포함).
  - id: cloud-modes
    term: 클라우드 세션의 모드
    kind: value
    tier: full
    desc: Accept edits · Plan · Auto 만 — Accept edits 가 default 에 대응
    aliases: [클라우드 권한]
    detail: |
      클라우드 세션은 파일 편집을 미리 승인하므로 선택기에 Manual 대신 **Accept edits** 가 뜨고,
      그것이 `default` 모드에 대응한다. Bypass permissions 는 없다.
      엔터프라이즈 관리자는 어떤 모드를 쓸 수 있는지 제한할 수 있다.
    see_also: [desktop/environments#cloud]
  - id: permission-modes-1
    term: 주의
    kind: note
    tier: core
    pin: true
    tone: warn
    desc: "Bypass: Pro/Max는 설정→Claude Code 토글, Team/Enterprise는 조직 정책. dontAsk 모드는 CLI 전용"
