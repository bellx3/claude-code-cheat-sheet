# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: pr-monitor
title: PR 모니터링
group: run
order: 100
sheet: desktop
summary: >-
  PR 상태를 앱 안에서 추적.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: pr-ci-github-cli-gh
    term: PR 생성 후 세션에 CI 상태 바 표시 (GitHub CLI gh 필요)
    kind: note
    tier: full
    detail: |
      `gh` 로 체크 결과를 주기적으로 물어 실패를 표면에 올린다. **`gh` 가 없으면 PR 을 처음
      만들려 할 때 설치를 안내한다.** 인증까지 되어 있어야 한다.
    tasks: [ci-headless-run]
  - id: auto-fix
    term: Auto-fix
    kind: value
    tier: full
    desc: ": 실패한 체크 자동 수정 시도"
    detail: |
      CI 상태 바의 토글로 켠다. 실패 출력을 읽고 고침을 반복한다 —
      터미널 쪽 `/autofix-pr` 이 클라우드 세션으로 같은 일을 맡기는 형태다.
    see_also: [slash/quality-security#autofix-pr-prompt]
  - id: auto-merge
    term: Auto-merge
    kind: value
    tier: full
    desc: ": 모든 체크 통과 시 squash 병합(GitHub에서 auto-merge 먼저 활성화 필요)"
    detail: |
      병합 방식은 **squash 고정**이다. GitHub 저장소 설정에서 auto-merge 를 먼저 켜 두지 않으면
      Claude 가 병합할 수 없다 — 토글은 켜지지만 병합이 되지 않는 상태가 된다.
  - id: pr-monitor-1
    term: 완료 시 데스크톱 알림
    kind: note
    tier: full
    detail: |
      CI 가 끝나면 OS 알림이 온다. PR 이 병합·닫히면 세션까지 자동으로 보관하려면
      설정 → Claude Code 의 auto-archive 를 켠다(로컬 세션 중 실행이 끝난 것에만 적용된다).
    see_also: [desktop/sessions#pr-auto-archive]
