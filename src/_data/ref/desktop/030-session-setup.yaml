# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: session-setup
title: 세션 시작 설정 (4가지)
group: start
order: 30
sheet: desktop
summary: >-
  세션 시작 위치가 접근 가능한 파일 범위 결정.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: environment
    term: Environment
    kind: value
    tier: core
    desc: Local/Cloud/SSH/WSL(Win) 선택
    aliases: [환경 선택, 실행 위치]
    detail: |
      **첫 메시지를 보내기 전에 정하는 값이고, 이후 기능 가용성의 대부분이 여기서 갈린다.**
      @멘션·커넥터·플러그인·터미널·사이드 채팅이 환경에 따라 있거나 없다.
      Cloud 는 앱을 닫아도 계속 돌고, SSH 는 원격 머신에서 돌고, WSL 은 Windows 의 리눅스 쪽에서 돈다.
    see_also: [desktop/environments#local, desktop/environments#cloud]
  - id: project-folder
    term: Project folder
    kind: value
    tier: core
    desc: 작업할 폴더·저장소 선택
    detail: |
      여기서 고른 폴더가 프리뷰 서버의 작업 디렉터리도 된다 — **부모 폴더를 고르면 하위 폴더의
      dev 서버는 자동 감지되지 않는다.** 클라우드 세션은 저장소를 여러 개 붙일 수 있다.
    see_also: [desktop/launch-json#name-runtimeexecutable]
  - id: model
    term: Model
    kind: value
    tier: core
    desc: 전송 버튼 옆 드롭다운(세션 중 변경 가능)
    detail: |
      CLI 의 `--model` 과 `ANTHROPIC_MODEL` 환경변수에 대응한다. 세션 중간에 같은 드롭다운에서
      바꿀 수 있고, 사용 가능한 모델 목록은 CLI 와 같다.
  - id: permission-mode
    term: Permission mode
    kind: value
    tier: core
    desc: 모드 선택기(세션 중 변경 가능)
    detail: |
      새 로컬 세션의 기본값은 설정 파일의 `permissions.defaultMode` 로 정한다.
      **선택기에서 고른 모드는 폴더별로 기억되고 그 폴더에서는 `defaultMode` 보다 우선한다** —
      Plan 만 예외로 현재 세션에만 적용된다.
    see_also: [desktop/permission-modes#manual-default]
