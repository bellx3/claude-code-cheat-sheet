# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: environments
title: 환경 종류
group: control
order: 250
sheet: desktop
summary: >-
  로컬·클라우드·자체 호스팅 중 실행 위치가 접근 가능 자원 결정.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: local
    term: Local
    kind: value
    tier: core
    desc: 내 컴퓨터에서 직접 실행
    aliases: [로컬, 내 컴퓨터]
    detail: |
      **앱이 내 셸 환경을 전부 물려받지는 않는다.** macOS 에서 Dock·Finder 로 실행하면
      `~/.zshrc`·`~/.bashrc` 를 읽되 `PATH` 와 정해진 몇 개의 Claude Code 변수만 가져오고,
      거기서 export 한 다른 변수는 오지 않는다. Windows 는 사용자·시스템 환경변수는 물려받지만
      PowerShell 프로필은 읽지 않는다.

      그래서 변수를 넣는 자리가 따로 있다 — 프롬프트 박스의 환경 드롭다운에서 **Local 에 마우스를
      올리고 톱니 아이콘**을 누르면 로컬 환경변수 편집기가 열린다. 여기 넣은 값은 암호화되어
      저장되고 **모든 로컬 세션과 프리뷰 서버에** 적용된다. `~/.claude/settings.json` 의 `env` 키는
      Claude 세션에만 닿고 dev 서버에는 닿지 않는다.
    caveat: '`npm`·`node` 를 못 찾는다면 대개 이 문제다 — 셸에서는 되는데 앱에서 안 되면 앱을 재시작해 환경을 다시 읽게 한다.'
    tasks: [it-broke]
  - id: cloud
    term: Cloud
    kind: value
    tier: core
    desc: Anthropic 관리 인프라, 앱 꺼도 계속 실행
    aliases: [클라우드, 원격 실행]
    detail: |
      사용량은 구독 플랜 한도에 합산되고 **별도 컴퓨트 과금은 없다.**
      네트워크 접근 수준과 환경변수가 다른 커스텀 클라우드 환경을 만들 수 있다 —
      클라우드 세션을 시작할 때 환경 드롭다운에서 **Add cloud environment**.

      제약도 함께 온다: @멘션·커넥터·플러그인 브라우저·터미널·파일 편집기·사이드 채팅이 없고,
      권한 모드는 Accept edits·Plan·Auto 만 있다.
    see_also: [desktop/permission-modes#cloud-modes, desktop/usage#cloud-cost]
  - id: ssh
    term: SSH
    kind: value
    tier: core
    desc: 원격 머신 연결 (Linux·macOS만)
    aliases: [SSH, 원격 머신]
    detail: |
      환경 드롭다운의 **+ Add SSH connection** 으로 추가한다. 물어보는 값은 넷 —
      **Name**(표시용 이름), **SSH Host**(`user@hostname` 또는 `~/.ssh/config` 의 호스트),
      **SSH Port**(비우면 22 또는 SSH 설정의 값), **Identity File**(비우면 기본 키·SSH 설정).

      원격은 **Linux 또는 macOS** 여야 하고, 처음 붙을 때 Claude Code 를 자동으로 설치한다.
      붙은 뒤에는 권한 모드·커넥터·플러그인·MCP 서버가 다 된다. 스킬은 **원격 홈의**
      `~/.claude/skills/` 를 읽는다.
    caveat: 관리자는 `sshHostAllowlist` 로 붙을 수 있는 호스트를 제한하고 `sshConfigs` 로 연결을 미리 배포할 수 있다. 빈 배열이면 SSH 세션 자체가 막힌다.
    see_also: [desktop/enterprise#managed-settings-disableautomode-sshhostal]
  - id: wsl-windows
    term: WSL (Windows)
    kind: value
    tier: core
    desc: WSL2 배포판 안에서 실행
    aliases: [WSL, 리눅스 배포판]
    detail: |
      WSL 2 배포판 안에서 그쪽 리눅스 툴체인과 네이티브 경로를 쓴다.
      **@멘션·커넥터·플러그인은 WSL 세션에 없다**(사이드 채팅은 된다).
    tasks: [windows-gotchas]
