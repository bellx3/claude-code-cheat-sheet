# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: browser-pane
title: 앱 미리보기 (Browser pane)
group: run
order: 70
sheet: desktop
summary: >-
  앱 안에서 로컬 서버를 띄워 결과 바로 확인. 코드 수정과 화면 확인의 왕복 단축.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: dev-dom
    term: 수정 후 자동으로 dev 서버 실행·검증(스크린샷/DOM검사/클릭/폼입력)
    kind: note
    tier: full
    detail: |
      프런트엔드만이 아니다 — **백엔드 서버도 대상**이다. API 엔드포인트를 때려 보고 서버 로그를
      읽고 찾은 문제를 고치는 것까지 같은 창에서 돈다.

      자동 검증(`autoVerify`)은 **기본 켜짐**이다. 프로젝트별로 `.claude/launch.json` 에
      `"autoVerify": false` 를 넣거나 서버 드롭다운에서 끌 수 있고, 끈 뒤에도 도구는 남아 있어
      필요할 때 직접 검증을 요청할 수 있다.
    see_also: [desktop/launch-json#launch-json-1]
  - id: browser-pane-1
    term: 서버 드롭다운에서 시작/중지
    kind: note
    tier: full
    detail: |
      세션 툴바의 서버 드롭다운에서 시작·중지, 전체 중지, 그리고 **Edit configuration** 으로
      `.claude/launch.json` 을 편집기에서 열 수 있다.
  - id: persist-sessions
    term: Persist sessions
    kind: value
    tier: full
    desc: ": 재시작해도 쿠키·로컬스토리지 유지"
    detail: |
      서버 드롭다운에서 켠다. 개발 중에 **매번 다시 로그인하지 않아도 되는 것**이 요점이다.
      저장된 세션 데이터를 지우거나 Browser 를 아예 끄는 것은 설정 → Claude Code 쪽이다.
  - id: html-pdf-browser-pane
    term: HTML/PDF/이미지/영상 경로 클릭 시 Browser pane에서 열림
    kind: note
    tier: full
    detail: |
      같은 경로를 파일 패널에서 열려고 해도 이 넷은 Browser pane 으로 간다.
      로컬 dev 서버와 프로젝트 파일은 승인 카드 없이 열리므로 자동 검증이 막히지 않는다.
    see_also: [desktop/terminal-editor#terminal-editor-1]
