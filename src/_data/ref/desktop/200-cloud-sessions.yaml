# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: cloud-sessions
title: 클라우드 세션 & 이어가기
group: run
order: 200
sheet: desktop
summary: >-
  실행을 웹으로 올려 기기를 닫아도 계속 진행.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: environment-cloud-claude-ai-code
    term: Environment에서 Cloud 선택 → 앱 종료해도 계속 실행, claude.ai/code·모바일 앱에서 확인
    kind: note
    tier: full
    detail: |
      대규모 리팩터, 테스트 스위트, 마이그레이션처럼 **오래 걸리는 것**을 올리는 자리다.
      Anthropic 관리 인프라에서 돌고, 컴퓨터를 끄더라도 계속 간다. 중간에 들어가 방향을
      바꿀 수도 있다.
    tasks: [long-running-work]
    see_also: [desktop/usage#cloud-cost]
  - id: cloud-sessions-1
    term: 여러 저장소 동시 추가 가능
    kind: note
    tier: full
    detail: |
      클라우드 환경을 고른 뒤 저장소 칩 옆 **+** 로 추가하고, **저장소마다 브랜치 선택기가
      따로 붙는다.** 공용 라이브러리와 그것을 쓰는 쪽을 함께 고치는 작업에 쓴다.
      CLI 의 `--add-dir` 에 해당하는 자리다.
  - id: continue-in
    term: Continue in
    kind: value
    tier: full
    desc: "메뉴: 웹 세션으로 전송 또는 IDE로 열기"
    aliases: [이어가기, 넘기기]
    detail: |
      세션 툴바 오른쪽 아래의 **VS Code 아이콘**에서 연다.

      **웹으로 보내기** — 브랜치를 푸시하고 대화 요약을 만들어 전체 맥락을 가진 클라우드 세션을
      새로 만든다. 로컬 세션은 보관하거나 남겨 둘 수 있다. 작업 트리가 깨끗해야 하고
      **SSH 세션에서는 쓸 수 없다.**

      **IDE 로 열기** — 현재 작업 디렉터리에서 프로젝트를 지원 IDE 로 연다.
  - id: branch-not-exist
    term: 로컬에 없는 브랜치
    kind: value
    tier: full
    desc: 클라우드 세션이 만든 브랜치는 fetch 가 필요
    aliases: [브랜치 없음, git fetch]
    detail: |
      클라우드 세션은 내 기기에 없는 브랜치를 만들 수 있다. CLI 에서 열려다 "Branch doesn't
      exist yet" 이 나오면 세션 툴바의 브랜치 이름을 클릭해 복사한 뒤 가져온다.
    code: |-
      git fetch origin <branch-name>
      git checkout <branch-name>
