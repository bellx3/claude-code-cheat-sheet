# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: computer-use
title: Computer Use
group: extend
order: 160
sheet: desktop
summary: >-
  실제 데스크톱 조작. 샌드박스 안의 Bash 와는 신뢰 경계가 별개.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: cli-gui
    term: 화면·앱 직접 조작 (CLI 없는 GUI 자동화용)
    kind: note
    tier: full
    detail: |
      **가장 넓고 가장 느린 수단이다.** Claude 는 정밀한 것부터 시도한다 —
      커넥터가 있으면 커넥터, 셸 명령이면 Bash, 브라우저 작업이고 Claude in Chrome 이 있으면 그것,
      iOS 앱 실행·테스트면 iOS 시뮬레이터 패널, 그 어느 것도 아닐 때 화면 조작이다.

      그래서 화면 조작이 남는 자리는 **다른 수단이 닿지 못하는 것** — 네이티브 앱, 하드웨어
      제어판, API 없는 사내 도구다.
    see_also: [desktop/connectors#connectors-1]
  - id: macos-windows-pro-max-team-enterprise
    term: macOS·Windows Pro/Max 리서치 프리뷰, Team/Enterprise 불가
    kind: note
    tier: full
    detail: |
      리서치 프리뷰다. Linux 앱에는 아직 없고, **Claude Desktop 앱이 실행 중이어야** 한다.
  - id: general-computer-use-macos
    term: "기본 꺼짐: 설정→General→Computer use 토글, macOS는 손쉬운 사용+화면 기록 권한 추가 필요"
    kind: note
    tier: full
    detail: |
      Windows 는 토글만 켜면 끝이고, macOS 는 시스템 권한 두 개가 더 필요하다 —
      **손쉬운 사용**(클릭·입력·스크롤)과 **화면 기록**(화면을 보는 것). 설정 화면이 각 권한의
      현재 상태를 보여주고, 거부 상태의 배지를 누르면 해당 시스템 설정으로 연결된다.

      꺼진 상태에서 화면 조작이 필요한 일을 시키면, Claude 가 "켜면 할 수 있다"고 알려준다.
  - id: view-only-click-only-ide-full-control-3
    term: View only(브라우저 등) / Click only(터미널·IDE) / Full control(그 외) 3단계
    kind: note
    tier: full
    detail: |
      **앱 범주에 따라 고정되어 있고 내가 바꿀 수 없다.** View only 는 스크린샷으로 보는 것까지,
      Click only 는 클릭·스크롤까지(입력·단축키 불가), Full control 은 끌기·단축키까지.

      브라우저를 view only, 터미널·IDE 를 click only 로 묶어 둔 것은 **전용 도구를 쓰도록
      밀어내는 장치**다. 터미널·파인더/탐색기·시스템 설정처럼 파급이 큰 앱은 승인 카드에
      경고가 더 붙는다.
  - id: 1-dispatch-30
    term: 세션당 1회 승인 (Dispatch 세션은 30분마다 재승인)
    kind: note
    tier: full
    detail: |
      앱을 처음 쓸 때 세션에 카드가 뜨고 **Allow for this session** 또는 **Deny** 를 고른다.

      설정 → General 에 두 가지가 더 있다 — **Denied apps** 는 묻지도 않고 거부할 앱 목록,
      **Unhide apps when Claude finishes** 는 작업 중 숨겨 둔 다른 창을 끝나고 되돌릴지 여부다
      (작업 중에는 승인된 앱만 다루도록 나머지 창을 숨긴다).
  - id: ios-simulator-pane
    term: iOS 시뮬레이터 패널
    kind: value
    tier: full
    desc: Computer use 를 켜지 않아도 동작 (macOS)
    aliases: [iOS, 시뮬레이터]
    detail: |
      iOS 앱을 돌리고 테스트할 때는 화면 조작이 아니라 **전용 패널**이 열린다.
      이 패널은 computer use 를 켜지 않아도 쓸 수 있다. 조직은 `disableMobileSimulatorTools` 로
      Claude 의 접근만 막을 수 있고(사람의 조작은 남는다).
  - id: computer-use-1
    term: 주의
    kind: note
    tier: core
    pin: true
    tone: warn
    desc: 실제 데스크톱을 조작 — 샌드박스 Bash와는 다른 신뢰 경계
