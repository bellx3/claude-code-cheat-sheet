# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: when-which
title: 데스크톱 vs CLI, 언제 무엇을
group: practice
order: 310
sheet: desktop
summary: >-
  터미널이 나은 상황과 앱이 나은 상황의 구분.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: when-which-1
    term: 설명
    kind: note
    tier: full
    desc: 병렬 세션 관리, 패널 배치, 변경사항 시각적 검토 → 데스크톱
    detail: |
      셋 다 **화면을 넓게 쓰는 일**이다. 세션 여러 개를 한 창에서 돌리고, 미리보기·터미널·diff 를
      나란히 두고, diff 의 줄에 코멘트를 달아 한꺼번에 넘긴다. 여기에 데스크톱만 있는 것이
      더 붙는다 — 파일 첨부, iOS 시뮬레이터 패널, Dispatch, Scheduled tasks, 앱·화면 조작.
  - id: when-which-2
    term: 설명
    kind: note
    tier: full
    desc: 스크립팅, 자동화, 터미널 워크플로우 선호 → CLI
    detail: |
      `--print`·Agent SDK·`dontAsk` 모드·에이전트 팀은 CLI 에만 있다. 파이프로 잇거나 CI 에서
      돌리는 것도 이쪽이다.

      **둘을 고르는 문제가 아니다** — 같은 엔진이고 설정을 공유하므로 같은 프로젝트에서 동시에
      쓰다가 `/desktop` 으로 세션을 옮길 수도 있다.
    see_also: [desktop/shared-settings#desktop]
