# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: trouble
title: 트러블슈팅
group: trouble
order: 320
sheet: desktop
summary: >-
  증상별 확인 순서. 채팅에 뜨는 API 오류(500·429·Prompt is too long)는 CLI·웹과 원인·해법이 같다.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: "403"
    term: 403/인증 오류 → 로그아웃 후 재로그인, 유료 구독 확인
    kind: note
    tier: full
    detail: |
      순서가 있다 — ① 앱 메뉴에서 로그아웃·재로그인(**가장 흔한 해결**) ② Pro·Max·Team·
      Enterprise 구독이 살아 있는지 ③ **CLI 는 되는데 앱만 안 되면** 창을 닫는 것이 아니라
      앱을 완전히 종료한 뒤 다시 열어 로그인 ④ 네트워크·프록시 설정.
    tasks: [it-broke]
  - id: cdn
    term: 화면 멈춤/빈 화면 → 재시작, 업데이트 확인, 방화벽 CDN 허용 확인
    kind: note
    tier: full
    detail: |
      macOS·Windows 는 실행할 때 자동 업데이트되고 Linux 는 apt 로 직접 올린다.
      관리망이면 CDN 호스트 허용 여부를 확인한다 — 앱 코드 자체를 CDN 에서 받으므로
      막히면 화면이 비어 보인다. Windows 는 이벤트 뷰어의 **Windows 로그 → 응용 프로그램** 에
      크래시 로그가 남는다.
    see_also: [desktop/network-data#network-data-1]
  - id: failed-to-load-session-git-lfs
    term: "\"Failed to load session\" → 폴더 존재 확인, Git LFS 설치 확인"
    kind: note
    tier: full
    detail: |
      원인은 셋 중 하나다 — 고른 폴더가 더 이상 없거나, 저장소가 Git LFS 를 요구하는데 없거나,
      파일 권한이 막고 있는 것. LFS 는 설치 후 `git lfs install` 까지 돌리고 앱을 재시작한다.
  - id: windows-git-is-required-git-for-windows
    term: Windows "Git is required" → Git for Windows 설치 후 재시작
    kind: note
    tier: full
    detail: |
      Windows 에서는 **Git 이 없으면 Code 탭의 로컬 세션이 아예 시작되지 않는다**(세션 격리가
      워크트리에 기대기 때문이다). 설치 후 `PATH` 는 새 터미널에만 반영되므로 앱도 재시작한다.
    tasks: [windows-gotchas]
  - id: mcp-windows
    term: MCP 서버 Windows 오류 → 설정 확인, 앱 재시작, 작업관리자에서 프로세스 확인
    kind: note
    tier: full
    detail: |
      토글이 반응하지 않거나 연결이 실패할 때의 순서다. 서버 로그의 연결 오류까지 확인한다.
    tasks: [windows-gotchas]
  - id: tools-not-found
    term: npm·node 등 설치한 도구를 못 찾음
    kind: note
    tier: full
    detail: |
      앱이 셸 프로필을 전부 읽지 않기 때문에 생긴다. 일반 터미널에서 그 도구가 되는지 확인하고,
      셸 프로필이 `PATH` 를 제대로 세우는지 보고, **앱을 재시작해 환경변수를 다시 읽게** 한다.
      로컬 세션·dev 서버에 확실히 넘기려면 로컬 환경변수 편집기에 적는다.
    see_also: [desktop/environments#local]
  - id: app-wont-quit
    term: 앱이 종료되지 않음
    kind: note
    tier: full
    detail: |
      macOS 는 `Cmd+Q`, 반응이 없으면 `Cmd+Option+Esc` 로 강제 종료.
      Windows 는 `Ctrl+Shift+Esc` 작업 관리자에서 Claude 프로세스를 끝낸다.
  - id: report-logs
    term: 신고할 때 무엇을 첨부하나
    kind: note
    tier: full
    detail: |
      앱 버전·OS·정확한 오류 메시지·관련 로그. macOS 는 Console.app, Windows 는 이벤트 뷰어 →
      Windows 로그 → 응용 프로그램. 독립 `claude` CLI 에서도 재현되는 문제는 GitHub Issues 로 간다.
    caveat: 로그에는 파일 경로와 환경 정보가 섞인다 — 공개 이슈에 붙이기 전에 발췌를 읽어 볼 것.
    see_also: [desktop/download-start#version-check]
