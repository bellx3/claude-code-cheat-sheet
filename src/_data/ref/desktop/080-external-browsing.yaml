# legacy/cheatsheet-desktop.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: external-browsing
title: 외부 사이트 브라우징
group: run
order: 80
sheet: desktop
summary: >-
  외부 사이트를 여는 경로. 문서에서 본 내용을 그대로 지시로 받아들이지 않도록 주의.
source:
  url: https://code.claude.com/docs/en/desktop
  checked_at: "2026-08-24"
items:
  - id: cmd-ctrl-shift-b-browser-pane
    term: Cmd/Ctrl+Shift+B 로 Browser pane 열기
    kind: note
    tier: full
    detail: |
      Browser pane 은 **탭 브라우저**다. 돌고 있는 앱 옆에 문서·이슈 트래커를 나란히 둘 수 있다.
      채팅의 외부 링크를 클릭하면 앱 안에서 열지(Open in app) 기본 브라우저로 보낼지 묻고,
      `Cmd`(macOS)·`Ctrl`(Windows) 클릭은 곧바로 시스템 브라우저로 보낸다.
  - id: allow-once-always-allow-deny
    term: 첫 접근 시 승인 카드(Allow once/Always allow/Deny), 서브도메인별 개별 승인
    kind: note
    tier: full
    detail: |
      **Allow once** 는 아무것도 저장하지 않고, **Always allow** 는 그 사이트 승인을 이 기기에
      저장한다(설정에서 철회 가능).

      검사는 두 겹이다 — 클릭·입력 같은 쓰기 동작은 **모든 권한 모드에서** 안전 분류기가 보고,
      Auto·Bypass 를 뺀 모드에서는 새 사이트로 이동하기 전에 도메인 허용 목록 검사가 한 번 더 붙는다.
    caveat: 승인된 사이트에서도 구매·계정 생성·CAPTCHA 우회는 내 입력 없이는 하지 않는다.
  - id: claude-in-chrome-browser-pane
    term: 로그인 상태 공유 필요하면 Claude in Chrome 확장 사용 (Browser pane은 별도 프로필)
    kind: note
    tier: full
    detail: |
      Browser pane 은 **깨끗한 프로필**이다 — 내 로그인도 이력도 없다. 앱을 만들고 테스트하는 일과
      신원이 필요 없는 사이트는 이쪽, **내 로그인 세션에서 나처럼 행동해야 하는 일**은 Chrome 확장 쪽이다.
  - id: allow-blocklist
    term: 조직 차원 allow/blocklist 및 외부 탐색 자체 차단 가능
    kind: note
    tier: full
    detail: |
      Chrome 확장용으로 이미 만들어 둔 허용·차단 목록을 Browser 가 그대로 따른다.

      관리 설정 두 개가 층이 다르다 — `browserExternalPageTools: "disabled"` 는 사람은 계속
      돌아다닐 수 있고 **Claude 의 도구만** 외부 페이지에서 못 읽고 못 누르게 한다.
      `disableBrowserExternalNavigation: true` 는 **사람과 Claude 양쪽의** 외부 이동을 막는다
      (localhost 미리보기와 파일 미리보기는 그대로).
    see_also: [desktop/enterprise#managed-settings-disableautomode-sshhostal]
