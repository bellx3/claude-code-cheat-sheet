# legacy/cheatsheet-slash.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: plan-control
title: 계획 & 실행 제어
group: session
order: 30
sheet: slash
summary: >-
  실행 전에 계획을 받거나, 완료 조건을 걸고 맡기는 축.
source:
  url: https://code.claude.com/docs/en/commands
  checked_at: "2026-08-23"
items:
  - id: plan-description
    term: /plan [description]
    kind: command
    tier: core
    desc: 계획 모드 진입
    aliases: [계획 모드, plan mode, 먼저 계획]
    detail: |
      프롬프트에서 바로 계획 모드로 들어간다. 설명을 붙이면 그 작업으로 계획을 시작한다
      (`/plan 인증 버그 고치기`).

      **비자명한 변경은 여기서 시작하는 편이 싸다.** 방향이 틀린 구현은 품질과 무관하게 전부
      버려지므로, 편집을 막아 둔 상태에서 계획을 먼저 받고 합의한 뒤 실행으로 넘긴다.
    tasks: [refactor-legacy-code]
  - id: background-prompt-bg
    term: /background [prompt], /bg
    kind: command
    tier: core
    desc: 세션을 백그라운드로 분리
    aliases: [백그라운드, 분리, detach]
    detail: |
      현재 세션을 **백그라운드 에이전트로 떼어내고 터미널을 돌려받는다.** 프롬프트를 붙이면
      떼어내기 전에 지시를 하나 더 보낸다. 진행은 `claude agents` 로 확인한다.

      이 세션을 그대로 두고 복사본만 백그라운드로 띄우려면 `/fork` 다.
    tasks: [long-running-work]
    see_also: [slash/session-mgmt#fork-prompt]
  - id: loop-interval-prompt
    term: /loop [interval] [prompt]
    kind: command
    tier: core
    desc: 프롬프트 반복 실행
    aliases: [/proactive, 반복 실행, 폴링]
    detail: |
      세션이 열려 있는 동안 프롬프트를 반복 실행하는 **번들 스킬**이다
      (`/loop 5m 배포 끝났는지 확인`).

      간격을 생략하면 Claude 가 스스로 간격을 정한다. 프롬프트까지 생략하면 자율 점검이나
      `.claude/loop.md` 의 내용을 돌린다. 짧은 간격으로 폴링하면 매 회차가 비용이므로,
      기다리는 대상이 실제로 얼마나 빨리 바뀌는지에 간격을 맞추는 편이 낫다.
    tasks: [long-running-work]
  - id: goal-condition-clear
    term: /goal [condition|clear]
    kind: command
    tier: core
    desc: 완료 조건 설정 후 자동 진행
    aliases: [목표, 완료 조건]
    detail: |
      조건을 걸면 **그 조건이 충족될 때까지 턴을 넘어 계속 작업한다.** 인자 없이 실행하면 현재
      목표나 마지막으로 달성한 목표를 보여준다. `clear`·`stop`·`off`·`reset`·`none`·`cancel`
      중 아무 것이나 주면 활성 목표를 먼저 해제한다.
    caveat: 조건이 검증 가능해야 한다 — "잘 되면"처럼 판정할 수 없는 조건을 걸면 멈출 근거가 없어 계속 돈다.
    tasks: [long-running-work]
  - id: subtask-prompt
    term: /subtask <prompt>
    kind: command
    tier: core
    desc: 서브에이전트에 하위작업 할당
    aliases: [하위 작업, 곁가지 위임]
    detail: |
      **전체 대화를 물려받은** 백그라운드 서브에이전트를 띄우고, 나는 계속 작업한다.
      끝나면 결과가 이 대화로 돌아온다(v2.1.212+).

      실질 이점은 전문성이 아니라 컨텍스트 격리다 — 파일 50개를 훑어야 하는 조사를 본 대화에
      쌓지 않고 결론만 받는다. 복사본을 별도 세션으로 띄우려면 `/fork` 다.
    tasks: [split-work-across-agents, shrink-context-cost]
    see_also: [slash/session-mgmt#fork-prompt]
  - id: batch-instruction
    term: /batch <instruction>
    kind: command
    tier: core
    desc: 병렬 대규모 변경 조직화
    aliases: [일괄 변경, 대규모 마이그레이션]
    detail: |
      코드베이스 전반의 대규모 변경을 병렬로 조직하는 **번들 스킬**이다
      (`/batch src/ 를 Solid 에서 React 로 옮겨`).

      코드베이스를 조사해 **독립 단위 5~30개로 쪼개고 계획을 먼저 제시한다.** 승인하면 단위마다
      백그라운드 서브에이전트를 격리된 git 워크트리에 띄우고, 각자 구현·테스트·PR 까지 낸다.
      git 저장소가 아니면 쓸 수 없다.
    caveat: PR 이 단위 수만큼 열린다 — 리뷰 부담을 감당할 수 있는 크기로 쪼개졌는지 계획 단계에서 확인할 것.
    tasks: [split-work-across-agents, refactor-legacy-code]
  - id: tasks
    term: /tasks
    kind: command
    tier: full
    desc: 세션의 백그라운드 작업 목록
    aliases: [/bashes, 작업 목록, 백그라운드 확인]
    detail: |
      이 세션의 백그라운드 작업을 보고 관리한다 — **끝난 서브에이전트도 포함**되므로 결과를
      놓쳤을 때 여기서 찾는다. 응답 중에도 즉시 실행되는 명령 중 하나다.
    tasks: [split-work-across-agents]
  - id: workflows
    term: /workflows
    kind: command
    tier: full
    desc: 워크플로 진행 화면
    aliases: [워크플로, 진행 보기]
    detail: |
      돌고 있는 워크플로의 진행 화면을 연다. 지켜보기·일시정지·재개, 그리고 완료된 워크플로
      저장까지 여기서 한다. 서브에이전트를 여러 개 부채꼴로 펼치는 작업의 실제 진행을
      확인할 수 있는 유일한 창구다.
    tasks: [split-work-across-agents]
  - id: schedule-description
    term: /schedule [description]
    kind: command
    tier: full
    desc: 클라우드 예약 실행(루틴)
    aliases: [/routines, 예약, 정기 실행, 크론]
    detail: |
      **클라우드에서 도는** 루틴을 만들고 고치고 목록으로 보고 즉시 실행한다. 설정은 대화로
      진행되고, 루틴의 최근 실행 결과도 물어볼 수 있다.

      `/loop` 는 세션이 열려 있는 동안만 도는 반복이고, 이쪽은 세션을 닫아도 남는 예약이다.
      GitHub 연결이 안 돼 있으면 `/web-setup` 을 먼저 물어본다.
    see_also: [slash/plan-control#loop-interval-prompt, slash/misc-utils#web]
