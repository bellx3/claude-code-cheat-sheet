  - id: market-lsp-2
    term: 설명
    kind: note
    tier: full
    desc: 설치 후 해당 언어서버 바이너리 별도 설치 필요 — 자동 진단(에러·타입) + 정밀 코드 탐색 제공
    detail: |
      이 계열은 Claude Code 내장 LSP 도구를 켜는 설정 묶음이다. 바이너리는 플러그인이 깔아 주지
      않으므로 표의 것을 직접 설치해야 한다. 얻는 것은 둘이다.

      **자동 진단** — 파일을 편집할 때마다 언어 서버가 에러·경고를 돌려준다. 컴파일러나 린터를
      돌리지 않고도 타입 오류·누락된 임포트를 그 턴 안에서 알아채고 고친다.
      직접 읽으려면 "Found N new diagnostic issues" 표시가 뜰 때 **Ctrl+O** 를 누른다.

      **정밀 탐색** — 정의로 이동, 참조 찾기, 타입 정보, 심볼 목록, 구현 찾기, 호출 계층.
      grep 기반 검색보다 정확하다(언어·환경에 따라 가용 범위는 다르다).
    caveat: 설치 후 `/plugin` Errors 탭에 `Executable not found in $PATH` 가 뜨면 바이너리가 없는 것이다 — 플러그인은 깔렸어도 아무 진단도 오지 않는다.
    see_also: [slash/plugin-syntax#plugin-discover-installed]
