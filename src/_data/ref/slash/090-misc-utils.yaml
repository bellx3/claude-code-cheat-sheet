# legacy/cheatsheet-slash.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: misc-utils
title: 기타 유틸리티
group: session
order: 90
sheet: slash
summary: >-
  자주 쓰이진 않지만 필요할 때 찾게 되는 것들.
source:
  url: https://code.claude.com/docs/en/commands
  checked_at: "2026-08-26"
items:
  - id: cd-path
    term: /cd <path>
    kind: command
    tier: core
    desc: 작업 디렉토리 이동
    aliases: [디렉터리 이동, 작업 위치]
    detail: |
      대화와 **프롬프트 캐시를 유지한 채** 세션의 작업 디렉터리를 옮긴다(v2.1.169+).
      부분 경로를 입력하면 후보가 뜨고 `Tab` 으로 채운다. 처음 다루는 위치면 워크스페이스를
      신뢰할지 먼저 묻고, 이후 `--resume` 이 옮겨진 세션을 찾아낸다.

      세션을 옮기지 않고 접근 권한만 추가하려면 `/add-dir` 다. 이동 대상을 제한하려면
      `Cd` 권한 규칙을 쓴다.
    see_also: [slash/misc-utils#add-dir-path]
  - id: add-dir-path
    term: /add-dir <path>
    kind: command
    tier: core
    desc: 작업 디렉토리 추가
    aliases: [디렉터리 추가, 다른 폴더]
    detail: |
      현재 세션에서 파일 접근이 가능한 작업 디렉터리를 추가한다. 성공하면 `DirectoryAdded` 훅이 돈다.
      응답 중에 실행하면 바로 확인을 묻고, 확인하면 **같은 턴의 다음 도구 호출부터** 접근된다
      (v2.1.234+).
    caveat: 추가한 디렉터리의 `.claude/` 설정은 대부분 읽히지 않는다 — 파일 접근 권한이 늘어나는 것이지 설정이 합쳐지는 것이 아니다.
    tasks: [stop-touching-wrong-files]
  - id: chrome
    term: /chrome
    kind: command
    tier: core
    desc: Claude in Chrome 설정
    aliases: [크롬, 브라우저 확장]
    detail: |
      Claude in Chrome 설정을 구성한다. 내 실제 Chrome 의 로그인 세션을 그대로 쓰는 경로이므로,
      로그인이 필요한 화면을 다뤄야 할 때 쓴다.
  - id: copy-n
    term: /copy [N]
    kind: command
    tier: core
    desc: 마지막 응답 클립보드 복사
    aliases: [복사, 클립보드]
    detail: |
      마지막 응답을 클립보드로 복사한다. 숫자를 주면 N번째 최신 응답을 복사한다(`/copy 2`).
      코드 블록이 있으면 **블록 단위로 고르는 선택기**가 뜨고, 거기서 `w` 를 누르면 클립보드 대신
      파일로 쓴다 — SSH 로 붙어 있을 때 유용하다.
  - id: login-logout
    term: /login, /logout
    kind: command
    tier: core
    desc: 계정 로그인/로그아웃
    aliases: [로그인, 로그아웃, 계정 전환]
    detail: |
      Anthropic 계정에 로그인·로그아웃한다. 개인 계정과 업무 계정을 오갈 때, 그리고
      구독이 필요한 기능(원격 제어·텔레포트 등)이 인증을 요구할 때 쓴다.
  - id: upgrade
    term: /upgrade
    kind: command
    tier: core
    desc: Claude Code 업그레이드
    aliases: [플랜 변경, 업그레이드]
    detail: |
      상위 플랜으로 바꾸는 페이지를 브라우저에서 연다. **CLI 자체를 업데이트하는 명령이 아니라
      요금제 변경**이다 — 버전 업데이트는 릴리스 채널 쪽이고 `/doctor` 가 새 버전 유무를 알려준다.
    caveat: 브라우저가 열리지 않는 환경(SSH 등)에서는 URL 을 출력하지 않고 로그인 안내만 뜬다.
  - id: stop
    term: /stop
    kind: command
    tier: full
    desc: 백그라운드 세션 중단
    aliases: [중단, 세션 정지]
    detail: |
      현재 백그라운드 세션을 세운다. **붙어 있는 동안만** 쓸 수 있고, 대화 기록과 워크트리는
      남는다. 세우지 않고 빠져나오려면 `/exit` 이나 왼쪽 화살표를 쓴다.
    see_also: [slash/plan-control#background-prompt-bg]
  - id: web
    term: /web
    kind: command
    tier: full
    desc: 공식 명령 표에 없음 (2026-08-24 확인)
    aliases: [웹 검색]
    detail: |
      초벌 이관 때 "웹 검색 도구 활성화"로 적혀 있었으나, **공식 명령 표(2026-08-24 확인)에
      `/web` 이 없다.** 이름이 바뀌었거나 사라진 것으로 보인다.

      대신 찾을 곳: 웹 세션용 GitHub 연결은 `/web-setup`, 도구 허용·차단은 `/permissions`,
      웹 검색 자체는 도구 권한과 설정에서 다룬다.
    see_also: [slash/collab-surfaces#web-setup, slash/system-extend#permissions]
  - id: focus
    term: /focus
    kind: command
    tier: full
    desc: 포커스 뷰 토글
    aliases: [포커스, 간소화 뷰]
    detail: |
      포커스 뷰를 토글한다 — 마지막 프롬프트, 요약된 도구 호출 통계, 최종 응답만 보여준다.
      도구 호출 요약에서 이번 턴에 시작된 서브에이전트 수도 세고, 완료된 백그라운드 작업 알림을
      하나로 합친다. 전체화면 렌더링에서만 사용 가능하다. 설정의 `viewMode` 로 덮어쓸 수 있다.
    see_also: [slash/settings-personal#tui-default-fullscreen]
  - id: ide
    term: /ide
    kind: command
    tier: full
    desc: IDE 통합 관리 및 상태
    aliases: [IDE, VS Code, 통합]
    detail: |
      IDE 통합을 관리하고 상태를 보여준다. VS Code 등 IDE에서 Claude Code를 사용할 때
      연결 상태와 설정을 확인하는 용도다.
  - id: release-notes
    term: /release-notes
    kind: command
    tier: full
    desc: 변경 로그
    aliases: [릴리스 노트, 업데이트 내역]
    detail: |
      대화형 버전 선택기로 변경 로그를 연다. 특정 버전을 선택해 해당 버전의 릴리스 노트를 보거나,
      모든 버전을 표시할 수도 있다. 노트는 대화 기록에 추가되지만 Claude 가 보는 대화에는 들어가지 않는다.
  - id: stickers
    term: /stickers
    kind: command
    tier: full
    desc: Claude Code 스티커 주문
    aliases: [스티커, 굿즈]
    detail: |
      Claude Code 스티커를 주문하는 페이지를 연다.
  - id: passes
    term: /passes
    kind: command
    tier: full
    desc: Claude Code 공유 패스
    aliases: [공유, 친구 초대]
    detail: |
      친구와 Claude Code를 무료로 1주일 공유할 수 있는 패스를 제공한다. 계정이 자격이 있을 때만 보인다.
  - id: radio
    term: /radio
    kind: command
    tier: full
    desc: Claude FM 라디오
    aliases: [라디오, 음악]
    detail: |
      브라우저에서 Claude FM lo-fi 라디오를 연다. 브라우저가 없으면 스트림 URL을 출력한다.
      일부 플랫폼(Amazon Bedrock, Google Cloud Agent Platform, Microsoft Foundry, Claude Platform on AWS)에서는
      사용할 수 없다.
  - id: powerup
    term: /powerup
    kind: command
    tier: full
    desc: Claude Code 기능 소개
    aliases: [기능 소개, 튜토리얼]
    detail: |
      애니메이션 데모가 있는 빠른 대화형 레슨으로 Claude Code 기능을 발견한다.
    tasks: [first-setup]
  - id: scroll-speed
    term: /scroll-speed
    kind: command
    tier: full
    desc: 마우스 휠 스크롤 속도
    aliases: [스크롤 속도, 휠 속도]
    detail: |
      마우스 휠 스크롤 속도를 대화형으로 조정한다. 대화상자가 열린 상태에서 눈금을 스크롤하며
      변경사항을 미리 볼 수 있다. 전체화면 렌더링에서만 사용 가능하며 JetBrains IDE 터미널에서는
      사용할 수 없다.
    see_also: [slash/settings-personal#tui-default-fullscreen]
  - id: setup-bedrock
    term: /setup-bedrock
    kind: command
    tier: full
    desc: Amazon Bedrock 설정
    aliases: [Bedrock, AWS]
    detail: |
      Amazon Bedrock 인증·리전·모델 핀을 대화형 마법사로 설정한다. `CLAUDE_CODE_USE_BEDROCK=1` 이
      설정되기 전까지는 명령 메뉴에 보이지 않으므로 전체 이름을 입력해야 한다. 첫 Amazon Bedrock
      사용자는 로그인 화면에서도 이 마법사에 접근할 수 있다.
    caveat: 명령 메뉴에 숨겨져 있으므로 전체 이름을 입력해야 한다.
  - id: setup-vertex
    term: /setup-vertex
    kind: command
    tier: full
    desc: Google Cloud Agent Platform 설정
    aliases: [Vertex AI, Google Cloud]
    detail: |
      Google Cloud Agent Platform 인증·프로젝트·리전·모델 핀을 대화형 마법사로 설정한다.
      `CLAUDE_CODE_USE_VERTEX=1` 이 설정되기 전까지는 명령 메뉴에 보이지 않으므로 전체 이름을
      입력해야 한다. 첫 Google Cloud Agent Platform 사용자는 로그인 화면에서도 이 마법사에 접근할 수 있다.
    caveat: 명령 메뉴에 숨겨져 있으므로 전체 이름을 입력해야 한다.
