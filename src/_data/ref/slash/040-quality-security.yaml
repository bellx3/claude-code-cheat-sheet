# legacy/cheatsheet-slash.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: quality-security
title: 코드 품질 & 보안
group: quality
order: 40
sheet: slash
summary: >-
  변경을 검토받는 명령들. 관점을 나눠 여러 번 돌리는 편이 더 깊이 들어감.
source:
  url: https://code.claude.com/docs/en/code-review
  checked_at: "2026-08-24"
items:
  - id: code-review-level-fix
    term: /code-review [level] [--fix]
    kind: command
    tier: core
    desc: diff·PR 검토 (별칭 /review)
    aliases: [/review, 코드 리뷰, 검토]
    detail: |
      현재 diff 또는 넘긴 PR 번호·브랜치·경로를 **정확성 버그와 정리 기회** 관점으로 검토한다.
      강도는 low·medium·high·xhigh·max·ultra 이고, 낮으면 확신 높은 소수만, 높이면 넓게 보되
      불확실한 지적도 섞인다.

      `--fix` 는 찾은 것을 작업 트리에 적용하고, `--comment` 는 GitHub PR 인라인 코멘트로 올린다.
      `ultra` 는 클라우드에서 도는 심층 다중 에이전트 리뷰다.
    caveat: 지적을 그대로 채택하지 말 것 — 리뷰도 오탐을 낸다. 기각한 항목은 사유와 함께 남겨야 다음 리뷰가 같은 것을 또 들고 온다.
    tasks: [review-before-merge, pre-commit-gate]
    see_also: [slash/quality-security#simplify]
  - id: security-review
    term: /security-review
    kind: command
    tier: core
    desc: diff 보안 취약점 검사
    aliases: [보안 검토, 취약점]
    detail: |
      **현재 브랜치와 origin 기본 브랜치의 차이**를 보안 관점으로 본다 — 인젝션, 인증 문제,
      데이터 노출 같은 위험을 찾는다. 커밋 안 된 변경만 보는 것이 아니라 브랜치 전체가 대상이다.
    caveat: origin 리모트가 필요하다. ambiguous argument 오류로 실패하면 origin/HEAD 를 찾지 못한 경우다.
    tasks: [review-before-merge, pre-commit-gate]
  - id: simplify
    term: /simplify
    kind: command
    tier: core
    desc: 코드 단순화 제안
    aliases: [단순화, 정리, 리팩토링]
    detail: |
      바뀐 코드를 **재사용·단순화·효율·추상화 높이** 네 관점의 에이전트가 병렬로 검토하고
      고침까지 적용한다. 경로나 PR 참조를 주면 그 대상만 본다.

      **v2.1.154 부터 정확성 버그는 찾지 않는다** — 버그는 `/code-review` 쪽이다.
      그 이전 버전에서는 `/code-review --fix` 와 같은 동작이었다.
    tasks: [refactor-legacy-code]
    see_also: [slash/quality-security#code-review-level-fix]
  - id: verify
    term: /verify
    kind: command
    tier: core
    desc: 코드 검증(스킬)
    aliases: [검증, 실제로 되는지]
    detail: |
      테스트나 타입체크에 기대지 않고 **프로젝트의 앱을 실제로 빌드·실행해 결과를 관찰**하는
      번들 스킬이다. 초록불이 대상을 보고 있지 않을 때를 잡는 쪽이 이 명령의 목적이다.
    caveat: 내가 부르지 않으면 실행되지 않는다(v2.1.215 이후). 자동으로 돌아 줄 것을 기대하지 말 것.
    tasks: [review-before-merge]
    see_also: [slash/quality-security#run]
  - id: autofix-pr-prompt
    term: /autofix-pr [prompt]
    kind: command
    tier: core
    desc: CI 실패 자동 수정 감시
    aliases: [CI 자동 수정, PR 감시]
    detail: |
      현재 브랜치의 PR 을 지켜보다가 **CI 가 깨지거나 리뷰 코멘트가 달리면 수정을 밀어 넣는**
      웹 세션을 띄운다. 기본값은 모든 CI 실패와 리뷰 코멘트를 고치는 것이고, 프롬프트를 주면
      범위를 좁힐 수 있다(`/autofix-pr 린트와 타입 오류만 고쳐`).

      `gh pr view` 로 체크아웃된 브랜치의 PR 을 찾으므로, 다른 PR 을 맡기려면 그 브랜치로
      먼저 옮겨야 한다. `gh` CLI 와 웹 접근 권한이 필요하다.
    tasks: [ci-headless-run]
  - id: run
    term: /run
    kind: command
    tier: full
    desc: 앱을 띄워 변경을 눈으로 확인
    aliases: [실행, 앱 띄우기]
    detail: |
      프로젝트의 앱을 실제로 띄우고 조작해 **변경이 동작하는 것을 눈으로 본다.** 테스트 통과가
      아니라 실행 결과가 근거가 된다. 프로젝트에 실행 방법을 담은 스킬이 있으면 그것을 먼저 찾고,
      없으면 프로젝트 종류별 기본 패턴(CLI·서버·TUI·브라우저)으로 띄운다.
    see_also: [slash/quality-security#verify]
  - id: ultrareview
    term: /ultrareview [PR|branch]
    kind: command
    tier: full
    desc: 클라우드 다중 에이전트 심층 리뷰
    aliases: [울트라 리뷰, 심층 리뷰]
    detail: |
      클라우드 샌드박스에서 도는 깊은 다중 에이전트 리뷰다. PR 참조를 주면 그 PR 을,
      브랜치 이름을 주면 비교 기준을 바꾼다.

      **권장 호출은 이제 `/code-review ultra` 이고 이 이름은 별칭으로 남아 있다.**
      Pro·Max 는 3회 무료, 이후는 사용 크레딧이 필요하다.
    see_also: [slash/quality-security#code-review-level-fix]
