# legacy/cheatsheet-slash.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: model-runtime
title: 모델 & 실행 설정
group: session
order: 20
sheet: slash
summary: >-
  모델·추론 강도를 세션 안에서 변경.
source:
  url: https://code.claude.com/docs/en/model-config
  checked_at: "2026-08-24"
items:
  - id: model-model
    term: /model [model]
    kind: command
    tier: core
    desc: 모델 변경
    aliases: [모델 변경, opus, sonnet, haiku]
    detail: |
      모델을 바꾸고 **새 세션의 기본값으로도 저장한다.** 이번 세션만 바꾸려면 선택기에서 해당 줄에
      `s` 를 누른다 — 이 구분을 모르면 잠깐 내렸던 모델이 다음 세션까지 따라온다.

      선택기에서 좌우 화살표로 추론 강도까지 같이 조정할 수 있다. 확인을 거치면 진행 중인 응답이
      끝나기를 기다리지 않고 바로 적용된다. `-p` 비대화 모드에서는 인자로 지정하며,
      그때는 세션에만 적용되고 기본값으로 저장되지 않는다(v2.1.205+).
    caveat: 모델을 바꾸면 프롬프트 캐시가 새로 쌓인다 — 긴 대화 중간에 오가며 바꾸면 캐시 이득을 계속 버리게 된다.
    tasks: [shrink-context-cost]
    see_also: [slash/model-runtime#effort-level-auto]
  - id: effort-level-auto
    term: /effort [level|auto]
    kind: command
    tier: core
    desc: 추론 강도 조정
    aliases: [추론 강도, effort, ultracode]
    detail: |
      `low` ~ `xhigh`, `max`, `ultracode`, `auto` 중에서 고른다. `status` 를 주면 현재 값을
      출력한다. **`max` 와 `ultracode` 는 세션 한정**이고, `ultracode` 설정 키 자체는 남는다.

      단순 반복 작업에 최고 강도를 쓸 이유가 없다. 비용이 빨리 닳으면 모델보다 먼저 이쪽을
      내려 보는 편이 회복이 빠르다.
    tasks: [shrink-context-cost, optimize-performance]
  - id: advisor-model-off
    term: /advisor [model|off]
    kind: command
    tier: core
    desc: 어드바이저 모델 켜기/끄기
    aliases: [어드바이저, 두 번째 모델]
    detail: |
      작업 중 중요한 지점에서 **두 번째 모델에게 조언을 구하는 도구**를 켜거나 끈다.
      `fable`·`opus`·`sonnet` 또는 전체 모델 ID 를 받고, 인자 없이 실행하면 선택기가 열린다.
      `fable` 은 Fable 5 접근 권한이 필요하다.
    caveat: 조언 호출은 별도의 모델 호출이다 — 켜 둔 채로 긴 작업을 돌리면 그만큼 비용이 늘어난다.
  - id: autocompact-auto-tokens
    term: /autocompact [auto|tokens]
    kind: command
    tier: core
    desc: 자동 컴팩트 기준 설정
    aliases: [자동 압축, 자동 컴팩트]
    detail: |
      컨텍스트가 얼마나 차면 자동으로 압축할지를 정한다. `500k` 처럼 크기를 주거나, `auto` 로
      모델에 맞춰진 기본값으로 되돌린다. 값은 사용자 설정에 저장되고 현재 세션에도 바로 적용된다.
      인자 없이 실행하면 현재 창을 보여주는 대화상자가 열린다(v2.1.221+).
    tasks: [shrink-context-cost]
    see_also: [slash/session-mgmt#compact]
  - id: fast-on-off
    term: /fast [on|off]
    kind: command
    tier: core
    desc: 패스트 모드 토글
    aliases: [패스트 모드, fast mode, 빠른 응답]
    detail: |
      패스트 모드를 켜고 끈다(v2.1.205+). **작은 모델로 내려가는 것이 아니라 같은 Opus 를 더 빠른
      출력으로 돌리는 것** — 품질을 낮춰 속도를 사는 옵션으로 오해하기 쉬운 지점이다.
      Opus 5 / 4.8 계열에서 쓸 수 있다.

      `-p` 비대화 모드에서의 사용 가능 범위는 제한적이다.
