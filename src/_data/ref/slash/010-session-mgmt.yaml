# legacy/cheatsheet-slash.html 에서 초벌 이관. detail/example/caveat/source.url 은 사람이 채운다.
id: session-mgmt
title: 세션 & 대화 관리
group: session
order: 10
sheet: slash
summary: >-
  대화 자체를 다루는 명령들. 작업이 바뀌면 이어가지 말고 자르는 편이 나음.
source:
  url: https://code.claude.com/docs/en/commands
  checked_at: "2026-08-23"
items:
  - id: clear-name
    term: /clear [name]
    kind: command
    tier: core
    desc: 새 대화 시작
    aliases: [/reset, /new, 초기화]
    detail: |
      컨텍스트를 비우고 새 대화를 연다. 이름을 붙여 두면 `/resume` 목록에서 방금 자른 대화가
      무엇이었는지 알아볼 수 있다 — 이름 없이 자르면 나중에 목록에서 구분이 안 된다.

      **같은 대화를 이어가면서 자리만 확보하려면 `/clear` 가 아니라 `/compact` 다.**
      잘라 놓고 후회했으면 `/resume` 으로 돌아가거나, 같은 프로세스 안이라면
      `/rewind` 메뉴의 '이전 세션' 항목으로 복원한다.
    tasks: [shrink-context-cost, stop-touching-wrong-files]
    see_also: [slash/session-mgmt#compact, slash/session-mgmt#resume]
  - id: compact
    term: /compact [지시]
    kind: command
    tier: core
    desc: 대화 요약
    aliases: [압축, 요약]
    detail: |
      지금까지의 대화를 요약해 컨텍스트를 비운다. 뒤에 지시를 붙이면 **무엇을 남길지 지정**할 수
      있다(`/compact 실측 수치와 결정만 남겨`). 규칙·스킬·메모리 파일이 압축 후에 어떻게
      남는지는 공식 문서의 context-window 문서에 정리돼 있다.
    caveat: 요약은 정보를 잃는다. 방금 확인한 파일 내용이나 실측 수치가 날아가면 다음 판단이 근거 없이 이뤄진다 — 중요한 수치는 압축 전에 파일로 남길 것.
    tasks: [shrink-context-cost]
  - id: context-all
    term: /context [all]
    kind: command
    tier: core
    desc: 컨텍스트 사용량 표시
    aliases: [컨텍스트 사용량, 토큰 분포]
    detail: |
      무엇이 컨텍스트를 먹고 있는지 색 격자로 보여준다. 컨텍스트를 많이 쓰는 도구, 비대해진
      메모리 파일, 한계 임박 경고까지 함께 뜬다. **감으로 자르지 말고 여기서 원인을 본 다음
      `/clear` 냐 `/compact` 냐를 정하는 순서**가 맞다.

      한계를 넘긴 상태면 얼마나 초과했는지와 어느 명령이 자리를 비우는지도 출력에 붙는다.
      전체화면 모드에서는 격자를 살리려고 항목별 내역을 접는데, `all` 을 주면 펼친다.
    tasks: [shrink-context-cost]
  - id: resume
    term: /resume
    kind: command
    tier: core
    desc: 다른 대화로 전환
    aliases: [/continue, 이어서, 어제 작업]
    detail: |
      ID·이름으로 대화를 재개하거나, 인자 없이 실행해 세션 선택기를 연다.
      백그라운드 세션은 목록에 `bg` 로 표시되고, **아직 돌고 있는 것은 여기서 재개할 수 없다** —
      `claude agents` 에서 붙거나 거기서 먼저 세우고 와야 한다.
    tasks: [resume-yesterday]
  - id: rename-name
    term: /rename [name]
    kind: command
    tier: core
    desc: 세션 이름 변경
    detail: |
      현재 세션 이름을 바꾸고 프롬프트 바에 띄운다. 이름을 생략하면 대화 이력에서 자동 생성한다.
      `-p` 비대화 모드에서도 쓸 수 있다(v2.1.205+).

      제어문자·보이지 않는 문자는 공백으로 치환되고 200자에서 잘린다. 그 처리 후 빈 이름이 되면
      거부된다. 같은 기기의 다른 세션이 이미 쓰는 이름이면 변형된 이름이 붙는다.
  - id: branch-name
    term: /branch [name]
    kind: command
    tier: core
    desc: 대화 분기
    aliases: [분기, 다른 방향]
    detail: |
      지금 지점에서 대화를 분기해 **분기 쪽으로 들어간다**. 원본은 그대로 남고 `/resume` 으로
      돌아올 수 있다. 다른 접근을 시험해 보고 싶은데 지금까지의 대화를 잃고 싶지 않을 때 쓴다.

      셋의 차이: 들어가는 것이 `/branch`, 복사본을 백그라운드로 띄우고 나는 여기 남는 것이
      `/fork`, 곁가지를 서브에이전트에 맡겨 결과만 이 대화로 받는 것이 `/subtask` 다.
    see_also: [slash/session-mgmt#fork-prompt, slash/plan-control#subtask-prompt]
  - id: fork-prompt
    term: /fork [prompt]
    kind: command
    tier: core
    desc: 새 백그라운드 세션으로 복사
    detail: |
      현재 대화를 **백그라운드 세션으로 복사**하고 나는 여기서 계속 작업한다. 프롬프트를 주면
      복사본이 바로 그 일을 시작하고, 없으면 에이전트 뷰에서 첫 지시를 기다린다.

      제자리 편집을 하는 경우를 빼면 복사본은 코드 변경 전에 자기 워크트리를 만들도록 지시받는다
      (v2.1.221+). v2.1.212 미만이거나 에이전트 뷰를 끈 환경에서는 `/fork` 가 대신
      포크된 서브에이전트로 동작한다.
    tasks: [split-work-across-agents]
  - id: export-filename
    term: /export [filename]
    kind: command
    tier: core
    desc: 대화 내보내기
    detail: |
      현재 대화를 평문으로 내보낸다. 파일명을 주면 그 파일로 바로 쓰고, 없으면 클립보드 복사와
      파일 저장을 고르는 대화상자가 열린다. 리뷰 근거나 인수인계 기록을 남길 때 쓴다.
  - id: diff
    term: /diff
    kind: command
    tier: core
    desc: 변경사항 대화형 뷰어
    aliases: [변경 확인, 무엇이 바뀌었나]
    detail: |
      커밋 안 된 변경과 **턴별 diff** 를 대화형으로 본다. 좌우 화살표로 현재 git diff 와 개별
      Claude 턴을 넘기고, 위아래로 파일을 훑고, Enter 로 해당 파일 diff 를 연다.
      Esc 로 파일 목록으로 돌아온다.

      열린 뷰어는 다른 터미널에서 브랜치를 바꾸거나 커밋해도 자동으로 갱신된다(v2.1.198+).
    caveat: diff 를 git blob 원본에서 계산하므로 `.gitattributes` 의 diff 드라이버·`textconv` 필터는 적용되지 않는다 — 뷰어가 보여주는 것은 저장소 원본이다.
    tasks: [review-before-merge]
  - id: rewind-turn
    term: /rewind [turn#]
    kind: command
    tier: core
    desc: 코드+대화 체크포인트 롤백
    aliases: [/checkpoint, /undo, 되돌리기, 롤백]
    detail: |
      대화만, 코드만, 또는 **둘 다** 이전 지점으로 되돌린다. 선택한 메시지 지점부터 요약하는
      선택지도 같은 메뉴에 있다.

      되돌리기 전에 무엇을 되돌리는지 확인할 것 — 코드까지 되돌리면 그 사이의 수동 편집도
      함께 사라진다. 잘못 고친 것을 되돌릴 때는 `git` 이 아니라 이쪽이 대화까지 같이 맞춰 준다.
    tasks: [undo-mistake]
  - id: btw-question
    term: /btw [question]
    kind: command
    tier: full
    desc: 대화에 안 남는 곁질문
    aliases: [사이드 질문, 곁질문]
    detail: |
      현재 세션에 대해 **대화 이력에 쌓지 않고** 질문한다. "지금 무슨 작업 중이었지" 같은 확인을
      본 대화의 컨텍스트를 늘리지 않고 물을 수 있다.

      질문 없이 실행하면 가장 최근 곁질문을 보여줘 이전 답을 다시 훑을 수 있다(v2.1.212+).
    tasks: [shrink-context-cost]
