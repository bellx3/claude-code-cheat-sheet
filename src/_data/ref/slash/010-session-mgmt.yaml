id: session-mgmt
title: 세션 & 대화 관리
icon: 💬
group: session
order: 10
sheet: slash
summary: >-
  대화 자체를 다루는 명령들. 작업이 바뀌면 이어가지 말고 자르는 편이 낫다.
source:
